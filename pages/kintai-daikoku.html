<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打刻 | 鳥やま 社内システム</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
  <img src="../assets/logo.png" alt="鳥やま" class="logo" style="width:64px;margin-bottom:24px;">
  <span class="demo-tag">テスト版・ICカード連携</span>
  <h1 class="page-title">打刻</h1>

  <div class="step" style="width:288px;">
    <div id="wait-area" class="card-wait">
      <div class="card-wait-icon">▢</div>
      <p class="card-wait-text">ICカードをリーダーにタッチしてください</p>
    </div>

    <div id="result-area" class="card-result" style="display:none;">
      <p class="card-result-name" id="result-name"></p>
      <p class="card-result-sub" id="result-sub"></p>
    </div>

    <div id="new-card-area" class="step" style="display:none;width:100%;">
      <p class="page-note" style="margin-bottom:10px;">未登録のカードです。持ち主を選んで登録してください。</p>
      <p class="card-result-sub" style="margin-bottom:12px;">読み取ったID: <span id="new-card-id"></span></p>
      <select class="field" id="new-card-name">
        <option value="">お名前を選択</option>
        <option>山田（バイト）</option>
        <option>佐藤（バイト）</option>
        <option>高橋（バイト）</option>
        <option>伊藤（バイト）</option>
        <option>店長（社員）</option>
        <option>副店長（社員）</option>
      </select>
      <button class="nav-btn" style="width:100%;" onclick="registerCard()">このカードを登録する</button>
    </div>

    <input id="card-input" class="hidden-input" type="text" autocomplete="off">

    <p class="page-note" style="margin:24px 0 8px;text-align:left;">直近の打刻ログ</p>
    <div id="log-list"></div>
  </div>

  <a class="back" href="kintai.html">勤怠管理へ戻る</a>
</div>

<script>
var cardsKey = "toriyama_staff_cards";
var logKey = "toriyama_kintai_log";

function getCards() {
  return JSON.parse(localStorage.getItem(cardsKey) || "{}");
}
function saveCards(cards) {
  localStorage.setItem(cardsKey, JSON.stringify(cards));
}
function getLog() {
  return JSON.parse(localStorage.getItem(logKey) || "[]");
}
function saveLog(log) {
  localStorage.setItem(logKey, JSON.stringify(log));
}

function timeNow() {
  var d = new Date();
  return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}

function renderLog() {
  var log = getLog();
  var el = document.getElementById("log-list");
  el.innerHTML = "";
  var recent = log.slice(-6).reverse();
  if (recent.length === 0) {
    el.innerHTML = '<p class="page-note">まだ打刻がありません</p>';
    return;
  }
  for (var i = 0; i < recent.length; i++) {
    var row = document.createElement("div");
    row.className = "log-row";
    row.innerHTML = "<span>" + recent[i].name + "　" + recent[i].type + "</span><span>" + recent[i].time + "</span>";
    el.appendChild(row);
  }
}

function focusInput() {
  document.getElementById("card-input").focus();
}

var pendingCardId = "";

function punch(name) {
  var log = getLog();
  var last = null;
  for (var i = log.length - 1; i >= 0; i--) {
    if (log[i].name === name) { last = log[i]; break; }
  }
  var type = (last && last.type === "出勤") ? "退勤" : "出勤";
  var time = timeNow();
  log.push({ name: name, type: type, time: time });
  saveLog(log);

  document.getElementById("wait-area").style.display = "none";
  document.getElementById("new-card-area").style.display = "none";
  var resultArea = document.getElementById("result-area");
  resultArea.className = "card-result";
  resultArea.style.display = "block";
  document.getElementById("result-name").textContent = name + "　" + type;
  document.getElementById("result-sub").textContent = time + " に記録しました";
  renderLog();

  setTimeout(function () {
    resultArea.style.display = "none";
    document.getElementById("wait-area").style.display = "block";
    focusInput();
  }, 2500);
}

function registerCard() {
  var name = document.getElementById("new-card-name").value;
  if (!name) { return; }
  var cards = getCards();
  cards[pendingCardId] = name;
  saveCards(cards);
  document.getElementById("new-card-area").style.display = "none";
  punch(name);
}

document.getElementById("card-input").addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    var cardId = this.value.trim();
    this.value = "";
    if (!cardId) { return; }

    var cards = getCards();
    if (cards[cardId]) {
      punch(cards[cardId]);
    } else {
      pendingCardId = cardId;
      document.getElementById("wait-area").style.display = "none";
      document.getElementById("new-card-id").textContent = cardId;
      document.getElementById("new-card-area").style.display = "block";
    }
  }
});

document.addEventListener("click", function () {
  var newCardArea = document.getElementById("new-card-area");
  if (newCardArea.style.display === "none") {
    focusInput();
  }
});
focusInput();
renderLog();
</script>
</body>
</html>
