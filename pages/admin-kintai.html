<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勤怠管理（管理者） | 鳥やま 社内システム</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
  <img src="../assets/logo.png" alt="鳥やま" class="logo" style="width:64px;margin-bottom:24px;">
  <span class="demo-tag">テスト版・仮データ</span>
  <h1 class="page-title">勤怠管理（管理者）</h1>
  <p class="page-note" style="margin-bottom:16px;">本日の全店舗・全スタッフの状況</p>

  <div class="step" style="width:288px;">
    <div class="store-box">
      <p class="store-box-title">新安城店</p>
      <div class="status-row"><span>山田</span><span class="status-pill working">出勤中 17:02〜</span></div>
      <div class="status-row"><span>高橋</span><span class="status-pill pending">未出勤</span></div>
    </div>

    <div class="store-box">
      <p class="store-box-title">本店</p>
      <div class="status-row"><span>佐藤</span><span class="status-pill done">退勤済 16:00〜21:30</span></div>
      <div class="status-row"><span>店長</span><span class="status-pill working">出勤中 16:30〜</span></div>
    </div>

    <div class="store-box">
      <p class="store-box-title">駅前店</p>
      <div class="status-row"><span>伊藤</span><span class="status-pill working">出勤中 17:15〜</span></div>
      <div class="status-row"><span>副店長</span><span class="status-pill pending">未出勤</span></div>
    </div>

    <div class="store-box">
      <p class="store-box-title">南店</p>
      <div class="status-row"><span>鈴木</span><span class="status-pill working">出勤中 17:00〜</span></div>
      <div class="status-row"><span>中村</span><span class="status-pill done">退勤済 15:30〜20:00</span></div>
    </div>

    <div class="store-box">
      <p class="store-box-title">西店</p>
      <div class="status-row"><span>加藤</span><span class="status-pill pending">未出勤</span></div>
      <div class="status-row"><span>渡辺</span><span class="status-pill working">出勤中 17:10〜</span></div>
    </div>
  </div>

  <a class="back" href="../admin.html">管理者ダッシュボードへ戻る</a>
</div>
</body>
</html>
