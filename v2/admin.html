<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者ダッシュボード | 鳥やま 社内システム</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="admin-wrap">
  <div class="admin-hero">
    <a class="store-header" href="pages/tenpo.html">表示店舗：<span class="store-header-current">全店舗</span><span class="store-header-caret">▾</span></a>
    <img src="assets/logo.png" alt="鳥やま" class="admin-hero-logo">
    <p class="admin-hero-name">TORIYAMA-iS</p>
    <p class="admin-hero-title">管理者ダッシュボード</p>
  </div>

  <div class="sales-today">
    <p class="sales-today-title">本日の売上</p>
    <div class="sales-grid" id="sales-grid"><p class="page-note">読み込み中...</p></div>
    <div class="sales-total-row" id="sales-total-row" style="display:none;">
      <a class="sales-total" href="pages/renraku-uriage.html"><p class="sales-card-name">本日合計</p><p class="sales-card-amount" id="sales-today-total">-</p></a>
      <a class="sales-total" href="pages/renraku-uriage.html"><p class="sales-card-name">今月合計</p><p class="sales-card-amount" id="sales-month-total">-</p></a>
    </div>
  </div>

  <div class="icon-grid">

    <a class="icon-tile" href="pages/admin-kintai.html">
      <div class="icon-tile-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg></div>
      <h2>勤怠管理</h2>
    </a>

    <a class="icon-tile" href="pages/admin-shift.html">
      <div class="icon-tile-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="0"></rect><path d="M3 9h18"></path><path d="M8 2v4"></path><path d="M16 2v4"></path></svg></div>
      <h2>シフト管理</h2>
    </a>

    <a class="icon-tile" href="pages/admin-zaiko.html">
      <div class="icon-tile-icon"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5-9 5-9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg></div>
      <h2>在庫管理</h2>
    </a>

    <a class="icon-tile" href="pages/admin-board.html">
      <div class="icon-tile-icon"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M10 21a2 2 0 004 0"></path></svg></div>
      <h2>社内連絡</h2>
    </a>

    <a class="icon-tile" href="pages/renraku-uriage.html">
      <div class="icon-tile-icon"><svg viewBox="0 0 24 24"><path d="M3 21h18"></path><path d="M6 21V10"></path><path d="M12 21V4"></path><path d="M18 21v-7"></path></svg></div>
      <h2>売上報告</h2>
    </a>

    <a class="icon-tile" href="pages/admin-staff.html">
      <div class="icon-tile-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg></div>
      <h2>STAFF登録</h2>
    </a>

  </div>

  <a class="back" href="index.html">トップへ戻る</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="shift-utils.js"></script>
<script>
function formatYen(n) {
  return "¥" + Math.round(n || 0).toLocaleString();
}

async function renderSalesSummary() {
  var grid = document.getElementById("sales-grid");
  var totalRow = document.getElementById("sales-total-row");

  if (typeof TORIYAMA_DB === "undefined" || !TORIYAMA_DB.isConfigured()) {
    grid.innerHTML = '<p class="page-note">Supabase未設定のため売上データを表示できません</p>';
    return;
  }

  var stores = await TORIYAMA_DB.fetchAllStores();
  var storeIdToName = {};
  stores.forEach(function (s) { storeIdToName[s.id] = s.name; });

  var reports = await TORIYAMA_DB.fetchAllSalesReports();

  var now = new Date();
  var todayStr = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
  var monthPrefix = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");

  var todayByStore = {};
  var monthByStore = {};
  reports.forEach(function (r) {
    var storeName = storeIdToName[r.store_id];
    if (!storeName) { return; }
    if (r.report_date === todayStr) {
      todayByStore[storeName] = (todayByStore[storeName] || 0) + (r.sales_amount || 0);
    }
    if (r.report_date && r.report_date.indexOf(monthPrefix) === 0) {
      monthByStore[storeName] = (monthByStore[storeName] || 0) + (r.sales_amount || 0);
    }
  });

  grid.innerHTML = "";
  var todayTotal = 0;
  var monthTotal = 0;

  STORE_LIST.forEach(function (store) {
    var today = todayByStore[store] || 0;
    var month = monthByStore[store] || 0;
    todayTotal += today;
    monthTotal += month;

    var displayName = store.replace("餃子酒場さんちょうめ", "餃子酒場<br>さんちょうめ");

    var a = document.createElement("a");
    a.className = "sales-card";
    a.href = "pages/renraku-uriage.html";
    a.innerHTML = "<p class=\"sales-card-name\">" + displayName + "</p><p class=\"sales-card-amount\">" + formatYen(today) + "</p><p class=\"sales-card-month\">今月 " + formatYen(month) + "</p>";
    grid.appendChild(a);
  });

  document.getElementById("sales-today-total").textContent = formatYen(todayTotal);
  document.getElementById("sales-month-total").textContent = formatYen(monthTotal);
  totalRow.style.display = "flex";
}

renderSalesSummary();
</script>
</body>
</html>
