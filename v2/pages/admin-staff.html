<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAFF登録 | 鳥やま 社内システム</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="admin-wrap" style="max-width:640px;">
  <div class="admin-hero" style="padding-bottom:16px;">
    <img src="../assets/logo.png" alt="鳥やま" class="admin-hero-logo" style="width:64px;">
    <p class="admin-hero-title" style="font-size:15px;letter-spacing:2px;">STAFF登録</p>
  </div>

  <div class="nav" style="flex-direction:row;width:auto;gap:8px;margin:0 auto 24px;justify-content:center;">
    <button type="button" class="nav-btn" id="tab-register" onclick="switchTab('register')">登録</button>
    <button type="button" class="nav-btn" id="tab-remove" onclick="switchTab('remove')">一覧</button>
  </div>

  <div id="register-panel" class="step" style="width:100%;max-width:336px;margin:0 auto;">
    <label class="staff-photo-input-label" for="in-photo">
      <div class="staff-photo staff-photo-picker" id="photo-preview">写真を選択</div>
    </label>
    <input type="file" id="in-photo" accept="image/*" style="display:none;" onchange="onPhotoChange(event)">

    <input class="field" id="in-name" type="text" placeholder="名前">

    <label class="page-note" style="display:block;text-align:left;margin:4px 0 2px;">勤務店舗（掛け持ち可・複数選択可）</label>
    <div id="in-store-checks" class="staff-store-checks"></div>

    <select class="field" id="in-employment">
      <option value="">雇用形態を選択</option>
      <option value="shain">社員</option>
      <option value="baito">バイト</option>
    </select>

    <label class="page-note" style="display:block;text-align:left;margin:4px 0 2px;">生年月日</label>
    <input class="field" id="in-birth" type="date">

    <label class="page-note" style="display:block;text-align:left;margin:4px 0 2px;">入社日</label>
    <input class="field" id="in-hire" type="date">

    <select class="field" id="in-gender">
      <option value="">性別を選択</option>
      <option value="male">男性</option>
      <option value="female">女性</option>
      <option value="other">その他・回答しない</option>
    </select>

    <p class="page-note" id="register-error" style="color:#993556;display:none;margin-bottom:10px;"></p>

    <button type="button" class="nav-btn" id="register-btn" onclick="doRegister()">登録</button>
  </div>

  <div id="remove-panel" class="step" style="width:100%;max-width:480px;margin:0 auto;display:none;">
    <p class="page-note" style="margin-bottom:16px;">解除するスタッフを選んでください</p>
    <div id="remove-list"></div>
  </div>

  <a class="back" href="../admin.html">管理者ダッシュボードへ戻る</a>
</div>

<div class="kintai-edit-overlay" id="confirm-overlay" style="display:none;">
  <div class="kintai-edit-modal">
    <p class="page-note" id="confirm-text" style="margin-bottom:16px;"></p>
    <div class="nav" style="flex-direction:row;width:auto;gap:8px;justify-content:center;">
      <button type="button" class="nav-btn" onclick="closeConfirm()">キャンセル</button>
      <button type="button" class="nav-btn" onclick="confirmRemove()">解除する</button>
    </div>
  </div>
</div>

<div class="kintai-edit-overlay" id="edit-stores-overlay" style="display:none;">
  <div class="kintai-edit-modal">
    <p class="page-note" id="edit-stores-text" style="margin-bottom:12px;"></p>
    <div id="edit-store-checks" class="staff-store-checks" style="margin-bottom:16px;"></div>
    <p class="page-note" id="edit-stores-error" style="color:#993556;display:none;margin-bottom:10px;"></p>
    <div class="nav" style="flex-direction:row;width:auto;gap:8px;justify-content:center;">
      <button type="button" class="nav-btn" onclick="closeEditStores()">キャンセル</button>
      <button type="button" class="nav-btn" id="edit-stores-save-btn" onclick="saveEditStores()">保存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-client.js"></script>
<script src="../shift-utils.js"></script>
<script src="../staff-utils.js"></script>
<script>
var photoDataUrl = "";
var pendingRemoveId = null;
var pendingEditId = null;

function buildStoreChecks(container) {
  container.innerHTML = "";
  STORE_LIST.forEach(function (store) {
    var label = document.createElement("label");
    label.className = "staff-store-check-row";
    var box = document.createElement("input");
    box.type = "checkbox";
    box.value = store;
    label.appendChild(box);
    label.appendChild(document.createTextNode(store));
    container.appendChild(label);
  });
}

function checkedStores(container) {
  return Array.prototype.slice.call(container.querySelectorAll("input:checked")).map(function (b) { return b.value; });
}

function populateStoreSelect() {
  buildStoreChecks(document.getElementById("in-store-checks"));
}

async function switchTab(tab) {
  document.getElementById("register-panel").style.display = (tab === "register") ? "block" : "none";
  document.getElementById("remove-panel").style.display = (tab === "remove") ? "block" : "none";
  document.getElementById("tab-register").classList.toggle("active", tab === "register");
  document.getElementById("tab-remove").classList.toggle("active", tab === "remove");
  if (tab === "remove") {
    document.getElementById("remove-list").innerHTML = '<p class="page-note">読み込み中...</p>';
    await syncStaffRosterFromSupabase();
    renderRemoveList();
  }
}

function onPhotoChange(e) {
  var file = e.target.files[0];
  if (!file) { return; }
  var reader = new FileReader();
  reader.onload = function () {
    photoDataUrl = reader.result;
    var preview = document.getElementById("photo-preview");
    preview.classList.remove("staff-photo-picker");
    preview.textContent = "";
    var img = document.createElement("img");
    img.src = photoDataUrl;
    preview.appendChild(img);
  };
  reader.readAsDataURL(file);
}

function clearForm() {
  document.getElementById("in-name").value = "";
  Array.prototype.slice.call(document.querySelectorAll("#in-store-checks input")).forEach(function (b) { b.checked = false; });
  document.getElementById("in-employment").value = "";
  document.getElementById("in-birth").value = "";
  document.getElementById("in-hire").value = "";
  document.getElementById("in-gender").value = "";
  document.getElementById("in-photo").value = "";
  photoDataUrl = "";
  var preview = document.getElementById("photo-preview");
  preview.classList.add("staff-photo-picker");
  preview.textContent = "写真を選択";
}

async function doRegister() {
  var name = document.getElementById("in-name").value.trim();
  var stores = checkedStores(document.getElementById("in-store-checks"));
  var employmentType = document.getElementById("in-employment").value;
  var birthDate = document.getElementById("in-birth").value;
  var hireDate = document.getElementById("in-hire").value;
  var gender = document.getElementById("in-gender").value;
  var errorEl = document.getElementById("register-error");
  var submitBtn = document.getElementById("register-btn");

  if (!name || !stores.length || !employmentType) {
    errorEl.textContent = "名前・勤務店舗（1つ以上）・雇用形態は必須です";
    errorEl.style.display = "block";
    return;
  }
  errorEl.style.display = "none";
  submitBtn.disabled = true;
  submitBtn.textContent = "登録中...";

  var res = await registerStaffMember({
    name: name,
    stores: stores,
    employmentType: employmentType,
    birthDate: birthDate,
    hireDate: hireDate,
    gender: gender,
    photo: photoDataUrl
  });

  submitBtn.disabled = false;
  submitBtn.textContent = "登録";

  if (res.error) {
    errorEl.textContent = "登録に失敗しました。通信環境を確認してもう一度お試しください";
    errorEl.style.display = "block";
    return;
  }

  clearForm();
  alert(name + "さんを登録しました");
}

function genderLabel(g) {
  if (g === "male") { return "男性"; }
  if (g === "female") { return "女性"; }
  if (g === "other") { return "その他"; }
  return "";
}

function employmentLabel(t) {
  if (t === "shain") { return "社員"; }
  if (t === "baito") { return "バイト"; }
  return "";
}

function renderRemoveList() {
  var list = document.getElementById("remove-list");
  list.innerHTML = "";
  var roster = getStaffRoster();

  if (!roster.length) {
    list.innerHTML = '<p class="page-note">登録されているスタッフがいません</p>';
    return;
  }

  roster.forEach(function (person) {
    var row = document.createElement("div");
    row.className = "staff-list-row";

    var photo = document.createElement("div");
    photo.className = "staff-photo staff-photo-small";
    if (person.photo) {
      var img = document.createElement("img");
      img.src = person.photo;
      photo.appendChild(img);
    } else {
      photo.classList.add("staff-photo-empty");
      photo.textContent = (person.name || "?").slice(0, 1);
    }
    row.appendChild(photo);

    var info = document.createElement("div");
    info.className = "staff-list-info";
    var nameLine = document.createElement("p");
    nameLine.className = "staff-list-name";
    nameLine.textContent = person.name;
    var subLine = document.createElement("p");
    subLine.className = "staff-list-sub";
    var storeLabel = (person.stores && person.stores.length) ? person.stores.join("・") : person.store;
    var subParts = [storeLabel];
    if (employmentLabel(person.employmentType)) { subParts.push(employmentLabel(person.employmentType)); }
    if (genderLabel(person.gender)) { subParts.push(genderLabel(person.gender)); }
    if (birthdayLabel(person.birthDate)) { subParts.push("誕生日 " + birthdayLabel(person.birthDate)); }
    subLine.textContent = subParts.join("　/　");
    info.appendChild(nameLine);
    info.appendChild(subLine);
    row.appendChild(info);

    var btnGroup = document.createElement("div");
    btnGroup.className = "staff-list-btn-group";

    var editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.className = "kintai-row-edit-btn";
    editBtn.textContent = "勤務店舗を編集";
    editBtn.onclick = function () { openEditStores(person); };
    btnGroup.appendChild(editBtn);

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "kintai-row-edit-btn";
    btn.textContent = "解除";
    btn.onclick = function () { openConfirm(person.id, person.name); };
    btnGroup.appendChild(btn);

    row.appendChild(btnGroup);

    list.appendChild(row);
  });
}

function openConfirm(id, name) {
  pendingRemoveId = id;
  document.getElementById("confirm-text").textContent = name + "さんを解除しますか？";
  document.getElementById("confirm-overlay").style.display = "flex";
}

function closeConfirm() {
  pendingRemoveId = null;
  document.getElementById("confirm-overlay").style.display = "none";
}

async function confirmRemove() {
  if (!pendingRemoveId) { return; }
  var id = pendingRemoveId;
  closeConfirm();
  document.getElementById("remove-list").innerHTML = '<p class="page-note">解除しています...</p>';
  var res = await unregisterStaffMember(id);
  if (res.error) {
    alert("解除に失敗しました。通信環境を確認してもう一度お試しください");
  }
  renderRemoveList();
}

function openEditStores(person) {
  pendingEditId = person.id;
  document.getElementById("edit-stores-text").textContent = person.name + "さんの勤務店舗（掛け持ち可・複数選択可）";
  document.getElementById("edit-stores-error").style.display = "none";
  var container = document.getElementById("edit-store-checks");
  buildStoreChecks(container);
  var current = person.stores && person.stores.length ? person.stores : (person.store ? [person.store] : []);
  Array.prototype.slice.call(container.querySelectorAll("input")).forEach(function (b) {
    b.checked = current.indexOf(b.value) !== -1;
  });
  document.getElementById("edit-stores-overlay").style.display = "flex";
}

function closeEditStores() {
  pendingEditId = null;
  document.getElementById("edit-stores-overlay").style.display = "none";
}

async function saveEditStores() {
  if (!pendingEditId) { return; }
  var stores = checkedStores(document.getElementById("edit-store-checks"));
  if (!stores.length) {
    document.getElementById("edit-stores-error").textContent = "1つ以上選択してください";
    document.getElementById("edit-stores-error").style.display = "block";
    return;
  }
  var id = pendingEditId;
  var saveBtn = document.getElementById("edit-stores-save-btn");
  saveBtn.disabled = true;
  saveBtn.textContent = "保存中...";
  var res = await updateStaffStores(id, stores);
  saveBtn.disabled = false;
  saveBtn.textContent = "保存";
  if (res.error) {
    document.getElementById("edit-stores-error").textContent = "保存に失敗しました。通信環境を確認してもう一度お試しください";
    document.getElementById("edit-stores-error").style.display = "block";
    return;
  }
  closeEditStores();
  await syncStaffRosterFromSupabase();
  renderRemoveList();
}

(async function init() {
  populateStoreSelect();
  await syncStaffRosterFromSupabase();
  switchTab("register");
})();
</script>
</body>
</html>
