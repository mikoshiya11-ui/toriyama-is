<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト管理（管理者） | 鳥やま 社内システム</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="admin-wrap" style="max-width:1100px;">
  <div class="admin-hero" style="padding-bottom:24px;">
    <img src="../assets/logo.png" alt="鳥やま" class="admin-hero-logo" style="width:64px;">
    <p class="admin-hero-title" style="font-size:15px;letter-spacing:2px;">シフト管理</p>
    <span class="demo-tag" style="margin-top:12px;">テスト版・仮データ</span>
  </div>

  <div class="shift-gantt-toolrow">
    <select class="shift-store-select" id="store-select" onchange="onStoreOrMonthChange()">
      <option>餃子酒場さんちょうめ</option>
      <option>鳥料理と炭火焼 鶏やま</option>
      <option>Tripot cafe BAKE stand</option>
      <option>Tripot cafe FOOD truck</option>
      <option>本部</option>
    </select>

    <div class="nav" style="flex-direction:row;width:auto;gap:6px;">
      <button class="nav-btn" style="padding:8px 12px;" onclick="changeMonth(-1)">◀</button>
      <span class="nav-btn" id="month-label" style="cursor:default;min-width:110px;"></span>
      <button class="nav-btn" style="padding:8px 12px;" onclick="changeMonth(1)">▶</button>
    </div>

    <p class="page-note" style="text-align:left;">申請があった日は自動で仮のシフトが置かれます。内容を見ながらドラッグで調整し、最後に確定してください。</p>

    <button class="nav-btn" id="zoom-toggle-btn" style="margin-left:auto;" onclick="toggleZoom()">月間表示</button>
  </div>

  <div class="shift-gantt-legend">
    <span class="lg-item"><span class="lg-swatch request"></span>スタッフの申請内容（点線・目安）</span>
    <span class="lg-item"><span class="lg-swatch preview"></span>仮置き（未確定・ドラッグで調整可）</span>
    <span class="lg-item"><span class="lg-swatch confirmed"></span>確定済み</span>
  </div>

  <div class="shift-gantt-card">
    <div class="shift-gantt-scroll">
      <div class="shift-gantt-inner" id="gantt-inner"></div>
    </div>
  </div>

  <p class="page-note" id="month-summary-line" style="display:none;margin-bottom:16px;"></p>

  <div id="bar-context-menu" class="bar-context-menu">
    <button type="button" data-action="preview">仮置きに戻す</button>
    <button type="button" data-action="delete">削除</button>
    <button type="button" data-action="color">色を変更...</button>
  </div>

  <div id="empty-state" class="page-note" style="display:none;margin-bottom:20px;">この店舗のスタッフはまだ登録されていません（テスト版）</div>

  <div class="nav" style="flex-direction:row;width:240px;gap:8px;margin:0 auto 8px;">
    <button class="nav-btn" style="flex:1;" onclick="addTempStaff()">＋臨時スタッフを追加</button>
  </div>

  <div class="nav" style="flex-direction:row;width:240px;gap:8px;margin:0 auto 8px;">
    <button class="nav-btn" style="flex:1;" id="undo-btn" onclick="undoLast()" disabled>元に戻す</button>
    <button class="nav-btn" style="flex:1;" onclick="saveConfirmed()">確定する</button>
  </div>
  <p class="confirm-msg" id="confirm-msg" style="display:none;">確定しました（テスト表示・この端末内のみ保存）</p>

  <a class="back" href="../admin.html">管理者ダッシュボードへ戻る</a>
</div>

<div class="kintai-edit-overlay" id="color-overlay" style="display:none;">
  <div class="kintai-edit-modal" style="max-width:260px;text-align:center;">
    <p class="page-note" id="color-overlay-text" style="margin-bottom:14px;"></p>
    <input type="color" id="store-color-input" style="width:100%;height:48px;border:1px solid #111111;margin-bottom:16px;">
    <div class="nav" style="flex-direction:row;width:auto;gap:8px;justify-content:center;">
      <button type="button" class="nav-btn" onclick="closeColorPicker()">キャンセル</button>
      <button type="button" class="nav-btn" onclick="saveStoreColorFromPicker()">保存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-client.js"></script>
<script src="../staff-utils.js"></script>
<script src="../shift-utils.js"></script>
<script>
var DETAIL_DAY_W = 100; // 鳥山社長要望：日付間隔を詰めて全体を見渡しやすくする
var MONTH_MIN_DAY_W = 16; // 月間表示で日付が判読できる最低限の幅
var zoomedOut = false;
var MIN_DURATION = 1; // 時間
var currentStoreColor = "#111111"; // 今表示中の店舗のガントバー色（render()の先頭で毎回更新）

// 月間表示（全体表示）は、横スクロールなしでひと月分すべてが画面内に収まるよう
// 表示エリアの実幅からその月の日数ぶんの列幅を逆算する（画面幅・月の日数に応じて自動調整）
function getDayWidth() {
  if (!zoomedOut) { return DETAIL_DAY_W; }
  var scrollEl = document.querySelector(".shift-gantt-scroll");
  var containerW = (scrollEl && scrollEl.clientWidth) ? scrollEl.clientWidth : 900;
  var sideW = 100; // .shift-gantt-side-head / .shift-gantt-side-cell の固定幅
  var numDays = daysInMonth(curYear, curMonthIdx);
  var w = Math.floor((containerW - sideW) / numDays);
  return Math.max(w, MONTH_MIN_DAY_W);
}
function getHourWidth() { return getDayWidth() / 24; }

function toggleZoom() {
  zoomedOut = !zoomedOut;
  document.getElementById("zoom-toggle-btn").textContent = zoomedOut ? "詳細表示" : "月間表示";
  document.getElementById("gantt-inner").classList.toggle("zoomed-out", zoomedOut);
  render();
}

// スタッフ一覧は shift-utils.js の getStoreStaffNames() 経由でSTAFF登録データから取得（社員が配列の先頭）

var requestsKey = "toriyama_shift_requests_month";
var confirmedKey = "toriyama_shift_confirmed_month";

var today = new Date();
var base = new Date(today.getFullYear(), today.getMonth() + 1, 1); // デフォルトは来月
var curYear = base.getFullYear();
var curMonthIdx = base.getMonth();

function getRequests() {
  try { return JSON.parse(localStorage.getItem(requestsKey) || "{}"); }
  catch (e) { return {}; }
}
function getConfirmed() {
  try { return JSON.parse(localStorage.getItem(confirmedKey) || "{}"); }
  catch (e) { return {}; }
}
function saveConfirmedData(c) {
  localStorage.setItem(confirmedKey, JSON.stringify(c));
}

function employeeMonthHasData(confirmed, name, mKey) {
  var record = confirmed[name];
  if (!record) { return false; }
  return Object.keys(record).some(function (k) { return k.indexOf(mKey) === 0; });
}

function changeMonth(delta) {
  var d = new Date(curYear, curMonthIdx + delta, 1);
  curYear = d.getFullYear();
  curMonthIdx = d.getMonth();
  onStoreOrMonthChange();
}

async function onStoreOrMonthChange() {
  var store = document.getElementById("store-select").value;
  render();
  var syncedA = await syncConfirmedShiftsFromSupabase(store, curYear, curMonthIdx);
  var syncedB = await syncShiftRequestsFromSupabase(store, curYear, curMonthIdx);
  var syncedC = await syncSalesTargetsFromSupabase(store, curYear, curMonthIdx);
  var syncedD = await syncStoreColorsFromSupabase();
  if (syncedA || syncedB || syncedC || syncedD) { render(); }
}

// 曜日・祝日で日付BOXに色を付ける（金=黄, 土=青, 日=赤、祝日はそれらより優先して橙）
function dayCellColorClass(year, monthIdx, day) {
  var jsDow = new Date(year, monthIdx, day).getDay(); // 0=日,...,6=土
  if (isJapaneseHoliday(year, monthIdx, day)) { return " holiday"; }
  if (jsDow === 5) { return " friday"; }
  if (jsDow === 6) { return " saturday"; }
  if (jsDow === 0) { return " sunday"; }
  return "";
}

function buildHeader(numDays) {
  var dayW = getDayWidth();
  var html = '<div class="shift-gantt-header-row"><div class="shift-gantt-side-head">氏名</div>';
  for (var day = 1; day <= numDays; day++) {
    var d = new Date(curYear, curMonthIdx, day);
    var wd = SHIFT_DAYS[jsDayToShiftIndex(d.getDay())];
    var colorCls = dayCellColorClass(curYear, curMonthIdx, day);
    html += '<div class="shift-gantt-day-cell' + colorCls + '" style="width:' + dayW + 'px;flex:0 0 ' + dayW + 'px;">' + (curMonthIdx + 1) + "/" + day + (zoomedOut ? "" : "(" + wd + ")") + "</div>";
  }
  html += '<div class="shift-gantt-summary-head">提出/確定/時間</div>';
  html += "</div>";
  return html;
}

// 日別の目標売上（日付の上に表示・入力する行）
function buildTargetRow(numDays, store) {
  var dayW = getDayWidth();
  var html = '<div class="shift-gantt-target-row"><div class="shift-gantt-side-head">目標売上</div>';
  for (var day = 1; day <= numDays; day++) {
    var dKey = dateKey(curYear, curMonthIdx, day);
    var val = getSalesTarget(store, dKey);
    if (zoomedOut) {
      html += '<div class="shift-gantt-target-cell" style="width:' + dayW + 'px;flex:0 0 ' + dayW + 'px;">' + (val !== null ? Math.round(val / 1000) + "k" : "") + '</div>';
    } else {
      html += '<div class="shift-gantt-target-cell" style="width:' + dayW + 'px;flex:0 0 ' + dayW + 'px;">' +
        '<input type="number" class="shift-target-input" data-datekey="' + dKey + '" value="' + (val !== null ? val : "") + '" placeholder="目標">' +
        '</div>';
    }
  }
  html += '<div class="shift-gantt-summary-head"></div>';
  html += "</div>";
  return html;
}

// その日の人件費合計（確定シフトの時間×時給。掲載中のスタッフ全員分）
function dayLaborCost(staff, confirmed, dKey) {
  var roster = getStaffRoster();
  var total = 0;
  staff.forEach(function (name) {
    var rec = confirmed[name] && confirmed[name][dKey];
    if (!rec || rec.off) { return; }
    var s = labelToHour(rec.start), e = labelToHour(rec.end);
    if (s === null || e === null) { return; }
    var person = roster.filter(function (p) { return p.name === name; })[0];
    var wage = (person && person.hourlyWage) ? Number(person.hourlyWage) : 0;
    total += (e - s) * wage;
  });
  return total;
}

// 人件費率の行（その日の人件費合計÷目標売上）。月間表示では右端に月間人件費率も出す
function buildLaborRateRow(numDays, store, staff, confirmed) {
  var dayW = getDayWidth();
  var html = '<div class="shift-gantt-laborrate-row"><div class="shift-gantt-side-head">人件費率</div>';
  var monthLaborTotal = 0;
  var monthTargetTotal = 0;
  for (var day = 1; day <= numDays; day++) {
    var dKey = dateKey(curYear, curMonthIdx, day);
    var cost = dayLaborCost(staff, confirmed, dKey);
    var target = getSalesTarget(store, dKey);
    monthLaborTotal += cost;
    if (target !== null) { monthTargetTotal += target; }
    var rateText = (target !== null && target > 0) ? (Math.round((cost / target) * 1000) / 10) + "%" : "-";
    html += '<div class="shift-gantt-laborrate-cell" style="width:' + dayW + 'px;flex:0 0 ' + dayW + 'px;">' + rateText + '</div>';
  }
  var monthRateText = monthTargetTotal > 0 ? (Math.round((monthLaborTotal / monthTargetTotal) * 1000) / 10) + "%" : "-";
  html += '<div class="shift-gantt-summary-cell">' +
    (zoomedOut ? ('<span>月間</span><span class="sum-hours">' + monthRateText + '</span>') : '') +
    '</div>';
  html += "</div>";
  return { html: html, monthLaborTotal: monthLaborTotal, monthTargetTotal: monthTargetTotal, monthRateText: monthRateText };
}

// その月の「提出数（希望を出した日数）」「確定数（確定シフトが入っている日数）」
// 「勤務時間の合計（確定分のみ）」をスタッフごとに集計する
function employeeMonthSummary(name, requests, confirmed) {
  var mKey = monthKey(curYear, curMonthIdx);
  var req = requests[name] || {};
  var conf = confirmed[name] || {};
  var submitted = 0;
  var confirmedDays = 0;
  var totalHours = 0;

  Object.keys(req).forEach(function (k) {
    if (k.indexOf(mKey) === 0 && req[k] && req[k].requested) { submitted++; }
  });

  Object.keys(conf).forEach(function (k) {
    if (k.indexOf(mKey) !== 0) { return; }
    var entry = conf[k];
    if (!entry || entry.off) { return; }
    confirmedDays++;
    var s = labelToHour(entry.start);
    var e = labelToHour(entry.end);
    if (s !== null && e !== null) { totalHours += (e - s); }
  });

  return { submitted: submitted, confirmedDays: confirmedDays, totalHours: totalHours };
}

function buildSummaryCell(name, requests, confirmed) {
  var s = employeeMonthSummary(name, requests, confirmed);
  var hoursText = (Math.round(s.totalHours * 10) / 10) + "時間";
  return '<div class="shift-gantt-summary-cell">' +
    '<span>提出 ' + s.submitted + '日</span>' +
    '<span>確定 ' + s.confirmedDays + '日</span>' +
    '<span class="sum-hours">' + hoursText + '</span>' +
    '</div>';
}

function buildBar(name, dKey, start, end, kind, isFree) {
  var hourW = getHourWidth();
  var left = start * hourW;
  var width = (end - start) * hourW;
  if (kind === "request") {
    var reqLine = '<div class="shift-bar-request" style="left:' + left + 'px;width:' + width + 'px;"></div>';
    var reqText = isFree ? "フリー" : (hourToLabel(start) + '–' + hourToLabel(end));
    var reqLabel = '<div class="shift-bar-request-time-label">' + reqText + '</div>';
    return reqLine + reqLabel;
  }
  var cls = "shift-bar" + (kind === "preview" ? " preview" : "");
  // 店舗ごとの色（デフォルト配色 or 右クリックで変更した色）をバーに反映する
  var colorStyle = (kind === "preview") ? ("border-color:" + currentStoreColor + ";") : ("background-color:" + currentStoreColor + ";");
  var bar = '<div class="' + cls + '" data-name="' + name + '" data-datekey="' + dKey + '" data-start="' + start + '" data-end="' + end + '" style="left:' + left + 'px;width:' + width + 'px;' + colorStyle + '">' +
    '<div class="handle left" data-role="handle-left"></div>' +
    '<div class="handle right" data-role="handle-right"></div>' +
    '</div>';
  // 時間表示はバー幅に縛られず、日付列いっぱいの幅で常に全文字が見えるように別要素で表示する
  var label = '<div class="shift-bar-time-label">' + hourToLabel(start) + '–' + hourToLabel(end) + '</div>';
  return bar + label;
}

// ============================================================
// 1回だけの元に戻す（直前の1操作＝ドラッグ/リサイズ/追加/休みにする、をまとめて取り消す）
// ============================================================
var lastSnapshot = null;

function takeSnapshot() {
  lastSnapshot = document.getElementById("gantt-inner").innerHTML;
  document.getElementById("undo-btn").disabled = false;
}

function clearSnapshot() {
  lastSnapshot = null;
  document.getElementById("undo-btn").disabled = true;
}

function undoLast() {
  if (lastSnapshot === null) { return; }
  document.getElementById("gantt-inner").innerHTML = lastSnapshot;
  clearSnapshot();
}

function render() {
  clearSnapshot();
  document.getElementById("month-label").textContent = monthLabel(curYear, curMonthIdx);

  var store = document.getElementById("store-select").value;
  currentStoreColor = getStoreColor(store);
  var staff = getStoreStaffNames(store);
  var requests = getRequests();
  var confirmed = getConfirmed();
  var inner = document.getElementById("gantt-inner");
  var emptyState = document.getElementById("empty-state");
  var summaryLine = document.getElementById("month-summary-line");
  var numDays = daysInMonth(curYear, curMonthIdx);

  if (!staff.length) {
    inner.innerHTML = "";
    emptyState.style.display = "block";
    summaryLine.style.display = "none";
    return;
  }
  emptyState.style.display = "none";

  var dayW = getDayWidth();
  var html = buildTargetRow(numDays, store);
  html += buildHeader(numDays);
  staff.forEach(function (name) {
    var req = requests[name];
    var empRecord = confirmed[name] || {};

    html += '<div class="shift-gantt-row">';
    html += '<div class="shift-gantt-side-cell">' + name + '</div>';

    for (var day = 1; day <= numDays; day++) {
      var dKey = dateKey(curYear, curMonthIdx, day);
      var reqDay = req ? req[dKey] : null;
      var confDay = empRecord[dKey];

      html += '<div class="shift-gantt-track" data-name="' + name + '" data-datekey="' + dKey + '" style="width:' + dayW + 'px;flex:0 0 ' + dayW + 'px;">';

      // 「1日フリーで入れる」希望は、時間帯の指定が無いので終日（0〜24時）のバーとして仮表示する
      var reqStart = reqDay && reqDay.free ? 0 : (reqDay ? labelToHour(reqDay.start) : null);
      var reqEnd = reqDay && reqDay.free ? 24 : (reqDay ? labelToHour(reqDay.end) : null);

      if (reqDay && reqDay.requested) {
        html += buildBar(name, dKey, reqStart, reqEnd, "request", !!reqDay.free);
      }

      // その日について「確定データが実際にあるか」だけを見る（月単位のフラグでは判定しない）。
      // これにより「仮置きに戻す」でその日の確定データだけを消した時、他の日の確定状態はそのまま保たれる。
      if (confDay) {
        if (!confDay.off) {
          html += buildBar(name, dKey, labelToHour(confDay.start), labelToHour(confDay.end), "confirmed");
        } else {
          html += '<div class="empty-hint" data-role="add" data-name="' + name + '" data-datekey="' + dKey + '">＋</div>';
        }
      } else if (reqDay && reqDay.requested) {
        html += buildBar(name, dKey, reqStart, reqEnd, "preview");
      } else {
        html += '<div class="empty-hint" data-role="add" data-name="' + name + '" data-datekey="' + dKey + '">＋</div>';
      }
      html += "</div>";
    }
    html += buildSummaryCell(name, requests, confirmed);
    html += "</div>";
  });

  var laborRow = buildLaborRateRow(numDays, store, staff, confirmed);
  html += laborRow.html;

  inner.innerHTML = html;

  if (zoomedOut) {
    summaryLine.style.display = "block";
    summaryLine.textContent = "月間目標売上合計　¥" + Math.round(laborRow.monthTargetTotal).toLocaleString() +
      "　／　月間人件費率　" + laborRow.monthRateText;
  } else {
    summaryLine.style.display = "none";
  }

  refreshOverlapWarnings();
}

// 目標売上の入力（日付の上の行）。入力欄はrender()の度に作り直されるため、
// 安定して存在するgantt-inner側でイベント委譲する
document.getElementById("gantt-inner").addEventListener("change", function (e) {
  var input = e.target.closest(".shift-target-input");
  if (!input) { return; }
  var store = document.getElementById("store-select").value;
  var dKey = input.dataset.datekey;
  var val = input.value !== "" ? Number(input.value) : null;
  pushSalesTarget(store, dKey, val).then(function () { render(); });
});

// ============================================================
// 臨時スタッフを追加（予備枠。追加後は通常のスタッフと同じ行として扱われる）
// ============================================================
async function addTempStaff() {
  var store = document.getElementById("store-select").value;
  var name = prompt("臨時スタッフのお名前を入力してください");
  if (!name) { return; }
  name = name.trim();
  if (!name) { return; }
  var res = await registerTempStaffMember(name, store);
  if (res.error) {
    alert("登録に失敗しました。通信環境を確認してもう一度お試しください");
    return;
  }
  render();
}

// ============================================================
// 店舗ごとの色を右クリックメニューから変更
// ============================================================
function openColorPicker() {
  var store = document.getElementById("store-select").value;
  document.getElementById("color-overlay-text").textContent = "「" + store + "」のガントバー色";
  document.getElementById("store-color-input").value = getStoreColor(store);
  document.getElementById("color-overlay").style.display = "flex";
}

function closeColorPicker() {
  document.getElementById("color-overlay").style.display = "none";
}

async function saveStoreColorFromPicker() {
  var store = document.getElementById("store-select").value;
  var color = document.getElementById("store-color-input").value;
  var res = await setStoreColor(store, color);
  closeColorPicker();
  if (res.error) {
    alert("色の保存に失敗しました。通信環境を確認してもう一度お試しください");
  }
  render();
}

// ============================================================
// 複数店舗シフト重複の警告（同じ人が別店舗で時間の重なる確定シフトを持っている場合に表示）
// ============================================================
async function refreshOverlapWarnings() {
  if (typeof TORIYAMA_DB === "undefined" || !TORIYAMA_DB.isConfigured()) { return; }
  var store = document.getElementById("store-select").value;
  var roster = getStaffRoster();
  var staff = getStoreStaffNames(store);
  var multiStoreNames = staff.filter(function (name) {
    var person = roster.filter(function (p) { return p.name === name; })[0];
    return !!(person && person.stores && person.stores.length > 1);
  });
  if (!multiStoreNames.length) { return; }

  var storeCode = (typeof STORE_CODE_MAP !== "undefined") ? STORE_CODE_MAP[store] : null;
  var currentStoreId = storeCode ? await TORIYAMA_DB.getStoreId(storeCode) : null;
  var crossData = await fetchCrossStoreConfirmedShifts(multiStoreNames, curYear, curMonthIdx);
  if (!crossData) { return; }

  var confirmed = getConfirmed();
  multiStoreNames.forEach(function (name) {
    var byDate = crossData[name];
    if (!byDate) { return; }
    Object.keys(byDate).forEach(function (dKey) {
      var otherEntries = byDate[dKey].filter(function (entry) { return entry.storeId !== currentStoreId; });
      if (!otherEntries.length) { return; }
      var mine = confirmed[name] && confirmed[name][dKey];
      if (!mine || mine.off || !mine.start || !mine.end) { return; }

      var conflicting = otherEntries.filter(function (entry) {
        return entry.start && entry.end && timeRangesOverlap(mine.start, mine.end, entry.start, entry.end);
      });
      if (!conflicting.length) { return; }

      var track = document.querySelector('.shift-gantt-track[data-name="' + name + '"][data-datekey="' + dKey + '"]');
      if (!track || track.querySelector(".shift-track-warning")) { return; }
      var badge = document.createElement("div");
      badge.className = "shift-track-warning";
      badge.textContent = "⚠";
      badge.title = name + "さんは" + conflicting.map(function (c) { return c.storeName + "(" + c.start + "–" + c.end + ")"; }).join("・") + "と時間が重複しています";
      track.appendChild(badge);
    });
  });
}

// ============================================================
// ドラッグ・リサイズ（SAKAE SEIKI-iS 生産管理-iSのガントと同じ操作感）
// ============================================================
var drag = null;

document.getElementById("gantt-inner").addEventListener("mousedown", function (e) {
  if (zoomedOut) { return; } // 月間表示は全体確認用。編集は詳細表示に戻ってから行う

  var addBtn = e.target.closest('[data-role="add"]');
  if (addBtn) {
    takeSnapshot();
    var track = addBtn.closest(".shift-gantt-track");
    var reqBar = track.querySelector(".shift-bar-request");
    // その月がまだ一度も確定されていない場合は、追加した直後は「仮置き」の見た目にする
    // （確定する前から黒塗りの確定済みバーに見えてしまうと紛らわしいため）
    var confirmedNow = getConfirmed();
    var mKeyNow = monthKey(curYear, curMonthIdx);
    var alreadyConfirmed = employeeMonthHasData(confirmedNow, addBtn.dataset.name, mKeyNow);
    track.innerHTML = reqBar ? reqBar.outerHTML : "";
    track.innerHTML += buildBar(addBtn.dataset.name, addBtn.dataset.datekey, 17, 22, alreadyConfirmed ? "confirmed" : "preview");
    return;
  }

  var handleLeft = e.target.closest('[data-role="handle-left"]');
  var handleRight = e.target.closest('[data-role="handle-right"]');
  var barEl = e.target.closest(".shift-bar");
  if (!barEl) { return; }
  e.preventDefault();
  takeSnapshot();

  drag = {
    barEl: barEl,
    mode: handleLeft ? "resize-left" : (handleRight ? "resize-right" : "move"),
    startX: e.clientX,
    origStart: Number(barEl.dataset.start),
    origEnd: Number(barEl.dataset.end)
  };
});

document.addEventListener("mousemove", function (e) {
  if (!drag) { return; }
  var hourW = getHourWidth();
  var deltaHour = Math.round(((e.clientX - drag.startX) / hourW) * 2) / 2;
  var start = drag.origStart;
  var end = drag.origEnd;

  if (drag.mode === "move") {
    var duration = drag.origEnd - drag.origStart;
    start = Math.max(0, Math.min(24 - duration, drag.origStart + deltaHour));
    end = start + duration;
  } else if (drag.mode === "resize-left") {
    start = Math.max(0, Math.min(drag.origEnd - MIN_DURATION, drag.origStart + deltaHour));
  } else if (drag.mode === "resize-right") {
    end = Math.min(24, Math.max(drag.origStart + MIN_DURATION, drag.origEnd + deltaHour));
  }

  drag.barEl.style.left = (start * hourW) + "px";
  drag.barEl.style.width = ((end - start) * hourW) + "px";
  drag.barEl.dataset.start = start;
  drag.barEl.dataset.end = end;
  var track = drag.barEl.closest(".shift-gantt-track");
  var label = track ? track.querySelector(".shift-bar-time-label") : null;
  if (label) { label.textContent = hourToLabel(start) + "–" + hourToLabel(end); }
});

document.addEventListener("mouseup", function () {
  drag = null;
});

// ============================================================
// 右クリックメニュー（誤クリックしやすい✕ボタンの代わり）
// ============================================================
var contextTargetBar = null;

function hideContextMenu() {
  document.getElementById("bar-context-menu").style.display = "none";
  contextTargetBar = null;
}

function deleteBar(barEl) {
  var track = barEl.closest(".shift-gantt-track");
  var oldLabel = track.querySelector(".shift-bar-time-label");
  barEl.remove();
  if (oldLabel) { oldLabel.remove(); }
  if (!track.querySelector(".empty-hint")) {
    track.innerHTML += '<div class="empty-hint" data-role="add" data-name="' + track.dataset.name + '" data-datekey="' + track.dataset.datekey + '">＋</div>';
  }
}

document.getElementById("gantt-inner").addEventListener("contextmenu", function (e) {
  if (zoomedOut) { return; } // 月間表示は全体確認用。編集は詳細表示に戻ってから行う
  var barEl = e.target.closest(".shift-bar");
  if (!barEl) { return; }
  e.preventDefault();
  contextTargetBar = barEl;
  var menu = document.getElementById("bar-context-menu");
  menu.style.left = e.clientX + "px";
  menu.style.top = e.clientY + "px";
  menu.style.display = "flex";
});

function revertToPreview(barEl) {
  // 見た目だけをpreviewクラスにするのではなく、その日の確定データ自体を消す。
  // そうしないと、月表示への切替や店舗・月の移動でrender()が再実行された瞬間に
  // 確定データが残ったままなので「確定済み」の見た目へ巻き戻ってしまう。
  var name = barEl.dataset.name;
  var dKey = barEl.dataset.datekey;
  var confirmed = getConfirmed();
  if (confirmed[name] && confirmed[name][dKey] !== undefined) {
    delete confirmed[name][dKey];
    saveConfirmedData(confirmed);
  }

  // 見た目は、この日のセルだけをリクエストデータから作り直す（全体再描画すると
  // takeSnapshot()で取った「元に戻す」用のスナップショットが無意味になるため、
  // add/deleteと同じくこのセル単体をその場で書き換える）
  var track = barEl.closest(".shift-gantt-track");
  var requests = getRequests();
  var reqDay = (requests[name] && requests[name][dKey]) || null;
  var reqBar = track.querySelector(".shift-bar-request");

  track.innerHTML = reqBar ? reqBar.outerHTML : "";
  if (reqDay && reqDay.requested) {
    track.innerHTML += buildBar(name, dKey, labelToHour(reqDay.start), labelToHour(reqDay.end), "preview");
  } else {
    track.innerHTML += '<div class="empty-hint" data-role="add" data-name="' + name + '" data-datekey="' + dKey + '">＋</div>';
  }
}

document.getElementById("bar-context-menu").addEventListener("click", function (e) {
  var btn = e.target.closest("button[data-action]");
  if (!btn || !contextTargetBar) { hideContextMenu(); return; }
  if (btn.dataset.action === "color") {
    hideContextMenu();
    openColorPicker();
    return;
  }
  takeSnapshot();
  if (btn.dataset.action === "preview") {
    revertToPreview(contextTargetBar);
  } else if (btn.dataset.action === "delete") {
    deleteBar(contextTargetBar);
  }
  hideContextMenu();
});

document.addEventListener("click", function (e) {
  var menu = document.getElementById("bar-context-menu");
  if (menu.style.display !== "none" && !menu.contains(e.target)) { hideContextMenu(); }
});

document.addEventListener("contextmenu", function (e) {
  if (!e.target.closest(".shift-bar")) { hideContextMenu(); }
});

async function saveConfirmed() {
  var confirmed = getConfirmed();
  var store = document.getElementById("store-select").value;
  var staff = getStoreStaffNames(store);
  var numDays = daysInMonth(curYear, curMonthIdx);
  var storeSubset = {};

  staff.forEach(function (name) {
    if (!confirmed[name]) { confirmed[name] = {}; }
    storeSubset[name] = {};
    for (var day = 1; day <= numDays; day++) {
      var dKey = dateKey(curYear, curMonthIdx, day);
      var track = document.querySelector('.shift-gantt-track[data-name="' + name + '"][data-datekey="' + dKey + '"]');
      var bar = track ? track.querySelector(".shift-bar") : null;
      var entry;
      if (bar) {
        entry = { off: false, start: hourToLabel(Number(bar.dataset.start)), end: hourToLabel(Number(bar.dataset.end)) };
      } else {
        entry = { off: true, start: "", end: "" };
      }
      confirmed[name][dKey] = entry;
      storeSubset[name][dKey] = entry;
    }
  });

  saveConfirmedData(confirmed);
  document.getElementById("confirm-msg").style.display = "block";
  render();

  await pushConfirmedShiftsToSupabase(store, curYear, curMonthIdx, storeSubset);
}

// 画面幅が変わった時（ウィンドウリサイズ・回転等）も、月間表示中は再計算してひと月分が収まるようにする
var resizeTimer = null;
window.addEventListener("resize", function () {
  if (!zoomedOut) { return; }
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 150);
});

(async function init() {
  await syncStaffRosterFromSupabase();
  render();
  var store = document.getElementById("store-select").value;
  var syncedA = await syncConfirmedShiftsFromSupabase(store, curYear, curMonthIdx);
  var syncedB = await syncShiftRequestsFromSupabase(store, curYear, curMonthIdx);
  var syncedC = await syncSalesTargetsFromSupabase(store, curYear, curMonthIdx);
  var syncedD = await syncStoreColorsFromSupabase();
  if (syncedA || syncedB || syncedC || syncedD) { render(); }
})();
</script>
