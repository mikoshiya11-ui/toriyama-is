<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出勤状況（管理者） | 鳥やま 社内システム</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="admin-wrap" style="max-width:960px;">
  <div class="admin-hero" style="padding-bottom:16px;">
    <img src="../assets/logo.png" alt="鳥やま" class="admin-hero-logo" style="width:64px;">
    <p class="admin-hero-title" style="font-size:15px;letter-spacing:2px;">出勤状況</p>
  </div>
  <p class="page-note" style="margin-bottom:8px;text-align:center;">本日の全店舗・全スタッフの状況</p>
  <p class="page-note" style="margin-bottom:16px;text-align:center;">打刻データをもとに、出勤中・休憩中・退勤済・未出勤を表示しています</p>

  <div class="nav no-print" style="flex-direction:row;width:auto;gap:8px;margin:0 auto 16px;justify-content:center;">
    <button class="nav-btn" onclick="refreshStatus()">更新</button>
  </div>

  <div class="store-box-grid" id="status-grid"></div>

  <a class="back" href="admin-kintai.html">勤怠管理へ戻る</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-client.js"></script>
<script src="../shift-utils.js"></script>
<script src="../staff-utils.js"></script>
<script>
function employmentSuffix(person) {
  return person.employmentType === "shain" ? "（社員）" : "";
}

// employeeId -> その日の打刻一覧（punched_at昇順）
var punchesTodayByEmployee = {};

// 打刻の最後の1件から状態を判定する（in/break_end→出勤中、break_start→休憩中、out→退勤済、無し→未出勤）
function computeStatus(employeeId) {
  var list = employeeId ? punchesTodayByEmployee[employeeId] : null;
  if (!list || !list.length) { return { label: "未出勤", cls: "pending" }; }
  var last = list[list.length - 1];
  if (last.type === "out") { return { label: "退勤済", cls: "done" }; }
  if (last.type === "break_start") { return { label: "休憩中", cls: "onbreak" }; }
  return { label: "出勤中", cls: "working" };
}

// 在籍スタッフ全員分の「本日の打刻」をSupabaseから取得する（Supabase未設定時は何もしない＝全員「未出勤」表示のまま）
async function syncTodayPunches() {
  punchesTodayByEmployee = {};
  if (typeof TORIYAMA_DB === "undefined" || !TORIYAMA_DB.isConfigured()) { return false; }
  var roster = getStaffRoster();
  var employeeIds = roster.map(function (p) { return p.id; }).filter(Boolean);
  if (!employeeIds.length) { return false; }

  var now = new Date();
  var todayStr = dateKey(now.getFullYear(), now.getMonth(), now.getDate());
  try {
    var rows = await TORIYAMA_DB.fetchPunchesForDate(employeeIds, todayStr);
    var map = {};
    rows.forEach(function (r) {
      if (!map[r.employee_id]) { map[r.employee_id] = []; }
      map[r.employee_id].push(r);
    });
    punchesTodayByEmployee = map;
    return true;
  } catch (e) {
    return false;
  }
}

function render() {
  var grid = document.getElementById("status-grid");
  grid.innerHTML = "";
  var roster = getStaffRoster();

  STORE_LIST.forEach(function (store) {
    var box = document.createElement("div");
    box.className = "store-box";

    var title = document.createElement("p");
    title.className = "store-box-title";
    title.textContent = store;
    box.appendChild(title);

    var staff = roster.filter(function (p) { return staffWorksAt(p, store); });
    var shain = staff.filter(function (p) { return p.employmentType === "shain"; });
    var baito = staff.filter(function (p) { return p.employmentType !== "shain"; });
    var ordered = shain.concat(baito);

    if (!ordered.length) {
      var empty = document.createElement("p");
      empty.className = "page-note";
      empty.style.textAlign = "left";
      empty.textContent = "登録されたスタッフがいません";
      box.appendChild(empty);
    } else {
      ordered.forEach(function (person) {
        var row = document.createElement("div");
        row.className = "status-row";
        var status = computeStatus(person.id);
        row.innerHTML = "<span>" + person.name + employmentSuffix(person) + "</span><span class=\"status-pill " + status.cls + "\">" + status.label + "</span>";
        box.appendChild(row);
      });
    }

    grid.appendChild(box);
  });
}

async function refreshStatus() {
  await syncStaffRosterFromSupabase();
  await syncTodayPunches();
  render();
}

(async function init() {
  document.getElementById("status-grid").innerHTML = '<p class="page-note">読み込み中...</p>';
  await refreshStatus();
})();
</script>
</body>
</html>
