<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出勤状況（管理者） | 鳥やま 社内システム</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="admin-wrap" style="max-width:960px;">
  <div class="admin-hero" style="padding-bottom:16px;">
    <img src="../assets/logo.png" alt="鳥やま" class="admin-hero-logo" style="width:64px;">
    <p class="admin-hero-title" style="font-size:15px;letter-spacing:2px;">出勤状況</p>
    <span class="demo-tag" style="margin-top:12px;">テスト版・仮データ</span>
  </div>
  <p class="page-note" style="margin-bottom:16px;text-align:center;">本日の全店舗・全スタッフの状況</p>

  <div class="store-box-grid">
    <div class="store-box">
      <p class="store-box-title">新安城店</p>
      <div class="status-row"><span>田中（社員）</span><span class="status-pill working">出勤中 16:55〜</span></div>
      <div class="status-row"><span>山田</span><span class="status-pill working">出勤中 17:02〜</span></div>
      <div class="status-row"><span>高橋</span><span class="status-pill pending">未出勤</span></div>
      <div class="status-row"><span>中島</span><span class="status-pill pending">未出勤</span></div>
    </div>

    <div class="store-box">
      <p class="store-box-title">本店</p>
      <div class="status-row"><span>佐藤（社員）</span><span class="status-pill working">出勤中 16:30〜</span></div>
      <div class="status-row"><span>鈴木（社員）</span><span class="status-pill done">退勤済 12:00〜17:00</span></div>
      <div class="status-row"><span>岡本</span><span class="status-pill done">退勤済 16:00〜21:30</span></div>
      <div class="status-row"><span>松本</span><span class="status-pill pending">未出勤</span></div>
    </div>

    <div class="store-box">
      <p class="store-box-title">駅前店</p>
      <div class="status-row"><span>伊藤（社員）</span><span class="status-pill working">出勤中 17:15〜</span></div>
      <div class="status-row"><span>木村</span><span class="status-pill working">出勤中 17:20〜</span></div>
      <div class="status-row"><span>斎藤</span><span class="status-pill pending">未出勤</span></div>
      <div class="status-row"><span>渡部</span><span class="status-pill pending">未出勤</span></div>
    </div>

    <div class="store-box">
      <p class="store-box-title">南店</p>
      <div class="status-row"><span>加藤（社員）</span><span class="status-pill pending">未出勤</span></div>
      <div class="status-row"><span>渡辺</span><span class="status-pill working">出勤中 17:10〜</span></div>
      <div class="status-row"><span>石井</span><span class="status-pill done">退勤済 15:30〜20:00</span></div>
    </div>

    <div class="store-box">
      <p class="store-box-title">西店</p>
      <div class="status-row"><span>中村（社員）</span><span class="status-pill done">退勤済 13:00〜18:00</span></div>
      <div class="status-row"><span>小林</span><span class="status-pill working">出勤中 17:05〜</span></div>
      <div class="status-row"><span>森田</span><span class="status-pill pending">未出勤</span></div>
    </div>
  </div>

  <a class="back" href="admin-kintai.html">勤怠管理へ戻る</a>
</div>
</body>
</html>
