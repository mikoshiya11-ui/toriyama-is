<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出勤状況（管理者） | 鳥やま 社内システム</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="admin-wrap" style="max-width:960px;">
  <div class="admin-hero" style="padding-bottom:16px;">
    <img src="../assets/logo.png" alt="鳥やま" class="admin-hero-logo" style="width:64px;">
    <p class="admin-hero-title" style="font-size:15px;letter-spacing:2px;">出勤状況</p>
  </div>
  <p class="page-note" style="margin-bottom:8px;text-align:center;">本日の全店舗・全スタッフの状況</p>
  <p class="page-note" style="margin-bottom:16px;text-align:center;">※本日の出退勤状況（出勤中／退勤済）は打刻データとの連携が未対応のため、現在は登録スタッフの一覧のみ表示しています</p>

  <div class="store-box-grid" id="status-grid"></div>

  <a class="back" href="admin-kintai.html">勤怠管理へ戻る</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-client.js"></script>
<script src="../shift-utils.js"></script>
<script src="../staff-utils.js"></script>
<script>
function employmentSuffix(person) {
  return person.employmentType === "shain" ? "（社員）" : "";
}

function render() {
  var grid = document.getElementById("status-grid");
  grid.innerHTML = "";
  var roster = getStaffRoster();

  STORE_LIST.forEach(function (store) {
    var box = document.createElement("div");
    box.className = "store-box";

    var title = document.createElement("p");
    title.className = "store-box-title";
    title.textContent = store;
    box.appendChild(title);

    var staff = roster.filter(function (p) { return p.store === store; });
    var shain = staff.filter(function (p) { return p.employmentType === "shain"; });
    var baito = staff.filter(function (p) { return p.employmentType !== "shain"; });
    var ordered = shain.concat(baito);

    if (!ordered.length) {
      var empty = document.createElement("p");
      empty.className = "page-note";
      empty.style.textAlign = "left";
      empty.textContent = "登録されたスタッフがいません";
      box.appendChild(empty);
    } else {
      ordered.forEach(function (person) {
        var row = document.createElement("div");
        row.className = "status-row";
        row.innerHTML = "<span>" + person.name + employmentSuffix(person) + "</span><span class=\"status-pill pending\">未出勤</span>";
        box.appendChild(row);
      });
    }

    grid.appendChild(box);
  });
}

(async function init() {
  document.getElementById("status-grid").innerHTML = '<p class="page-note">読み込み中...</p>';
  await syncStaffRosterFromSupabase();
  render();
})();
</script>
</body>
</html>
