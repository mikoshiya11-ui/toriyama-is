<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打刻 | 鳥やま 社内システム</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
  <img src="../assets/logo.png" alt="鳥やま" class="logo" style="width:64px;margin-bottom:24px;">

  <!-- ============================================================
       店舗設定画面：この端末で初めて開いたとき／設定変更時に表示
       ============================================================ -->
  <div id="setup-area" style="display:none;width:288px;">
    <h1 class="page-title">店舗設定</h1>
    <p class="page-note" style="margin-bottom:16px;">この端末を固定する店舗を選んでください。一度設定すれば、次回からはこの画面は出ません。</p>

    <select class="field" id="setup-store-select">
      <option value="">店舗を選択</option>
    </select>

    <p class="page-note" id="setup-error" style="color:#993556;display:none;margin-bottom:10px;"></p>

    <button type="button" class="nav-btn" onclick="confirmStoreSetup()">この店舗に設定する</button>
  </div>

  <!-- ============================================================
       打刻画面：店舗設定済みのときに表示
       ============================================================ -->
  <div id="punch-area" style="display:none;width:100%;flex-direction:column;align-items:center;">
    <span class="demo-tag" id="mode-tag">テスト版</span>
    <p class="page-note" id="conn-status" style="margin-bottom:8px;"></p>
    <h1 class="page-title">打刻</h1>
    <p class="page-note" id="store-label-note" style="margin-bottom:16px;"></p>

    <div class="step" style="width:288px;">
      <select class="field" id="punch-name">
        <option value="">お名前を選択</option>
      </select>

      <div class="punch-btn-row">
        <div class="punch-btn-col">
          <button type="button" class="punch-btn punch-in" id="btn-in" onclick="doPunch('in')" disabled>出勤</button>
          <button type="button" class="punch-btn-half punch-break-start" id="btn-break-start" onclick="doPunch('break_start')" disabled>休憩</button>
        </div>
        <div class="punch-btn-col">
          <button type="button" class="punch-btn punch-out" id="btn-out" onclick="doPunch('out')" disabled>退勤</button>
          <button type="button" class="punch-btn-half punch-break-end" id="btn-break-end" onclick="doPunch('break_end')" disabled>休憩戻り</button>
        </div>
      </div>

      <div id="result-area" class="card-result" style="display:none;">
        <p class="card-result-name" id="result-name"></p>
        <p class="card-result-sub" id="result-sub"></p>
      </div>

      <p class="page-note" style="margin:24px 0 8px;text-align:left;">直近の打刻ログ</p>
      <div id="log-list"></div>
    </div>

    <a class="back" href="#" onclick="changeStoreSetup(); return false;" style="margin-top:16px;">店舗設定を変更</a>
  </div>

  <a class="back" href="kintai.html">勤怠管理へ戻る</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-client.js"></script>
<script src="../staff-utils.js"></script>
<script src="../shift-utils.js"></script>
<script>
/*
  この端末が固定されている店舗コード／店舗名。
  以前はここに固定値を直接書いていたが、店舗ごとにファイルを書き換える必要があり
  運用が煩雑だったため、初回起動時に画面で選んでlocalStorageに保存する方式に変更した。
  （打刻画面自体は引き続き店舗を選択させない＝一度設定したら固定という仕様は維持）
*/
var terminalStoreKey = "toriyama_terminal_store_name";
var STORE_CODE = "";
var STORE_NAME = "";

function populateSetupStoreSelect() {
  var sel = document.getElementById("setup-store-select");
  STORE_LIST.forEach(function (store) {
    var o = document.createElement("option");
    o.value = store;
    o.textContent = store;
    sel.appendChild(o);
  });
}

function confirmStoreSetup() {
  var store = document.getElementById("setup-store-select").value;
  var errorEl = document.getElementById("setup-error");
  if (!store) {
    errorEl.textContent = "店舗を選択してください";
    errorEl.style.display = "block";
    return;
  }
  localStorage.setItem(terminalStoreKey, store);
  startPunchScreen(store);
}

function changeStoreSetup() {
  if (!confirm("店舗設定を変更しますか？（この端末で打刻する店舗が切り替わります）")) { return; }
  localStorage.removeItem(terminalStoreKey);
  document.getElementById("punch-area").style.display = "none";
  document.getElementById("setup-area").style.display = "block";
}

async function startPunchScreen(store) {
  STORE_NAME = store;
  STORE_CODE = STORE_CODE_MAP[store] || "";

  document.getElementById("setup-area").style.display = "none";
  document.getElementById("punch-area").style.display = "flex";
  document.getElementById("store-label-note").textContent = STORE_NAME + "　（お名前を読み込み中...）";

  await syncStaffRosterFromSupabase();
  document.getElementById("store-label-note").textContent = STORE_NAME + "　お名前を選んで、出勤・退勤・休憩のボタンを押してください";
  populateNameSelect();

  document.getElementById("mode-tag").textContent = TORIYAMA_DB.isConfigured()
    ? "Supabase連携・オフライン対応"
    : "テスト版（ローカル保存のみ）";

  renderLog();
  updateConnStatus();
  if (TORIYAMA_DB.isConfigured()) {
    flushQueue();
    setInterval(flushQueue, 30000);
  }
}

function populateNameSelect() {
  var sel = document.getElementById("punch-name");
  getStoreStaffNames(STORE_NAME).forEach(function (name) {
    var o = document.createElement("option");
    o.value = name;
    o.textContent = name + (isShain(name) ? "（社員）" : "（バイト）");
    sel.appendChild(o);
  });
}

// ---- ローカル（レガシー/オフライン共通）ストレージ ----
var localLogKey = "toriyama_kintai_log";       // 画面表示用の打刻ログ（両モード共通）
var employeeCacheKey = "toriyama_employee_cache"; // Supabaseから解決した従業員IDのキャッシュ（名前→employee）
var queueKey = "toriyama_punch_queue";         // 未送信の打刻キュー

function getJSON(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
  catch (e) { return fallback; }
}
function setJSON(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function timeNow() {
  var d = new Date();
  return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}

function renderLog() {
  var log = getJSON(localLogKey, []);
  var el = document.getElementById("log-list");
  el.innerHTML = "";
  var recent = log.slice(-6).reverse();
  if (recent.length === 0) {
    el.innerHTML = '<p class="page-note">まだ打刻がありません</p>';
    return;
  }
  for (var i = 0; i < recent.length; i++) {
    var row = document.createElement("div");
    row.className = "log-row";
    var suffix = recent[i].queued ? "（同期待ち）" : "";
    row.innerHTML = "<span>" + recent[i].name + "　" + recent[i].type + suffix + "</span><span>" + recent[i].time + "</span>";
    el.appendChild(row);
  }
}

function showResult(name, typeLabel, queued) {
  var resultArea = document.getElementById("result-area");
  resultArea.style.display = "block";
  document.getElementById("result-name").textContent = name + "　" + typeLabel;
  document.getElementById("result-sub").textContent = timeNow() + " に記録しました" + (queued ? "（通信復旧後に同期します）" : "");

  setTimeout(function () {
    resultArea.style.display = "none";
  }, 2500);
}

// 通信中など、一時的に全ボタンを触れなくする（連打防止の一次ロック）
function setButtonsEnabled(enabled) {
  document.getElementById("btn-in").disabled = !enabled;
  document.getElementById("btn-out").disabled = !enabled;
  document.getElementById("btn-break-start").disabled = !enabled;
  document.getElementById("btn-break-end").disabled = !enabled;
}

// ============================================================
// 二度打ち防止：直前の打刻の種類から、次に押せるボタンだけを決める
//   （未出勤/退勤済み → 出勤のみ／出勤中 → 退勤・休憩／休憩中 → 休憩戻りのみ）
// ============================================================
var currentLastType = null; // 選択中の人の、直近の打刻の種類（null=まだ出勤していない）

function allowedNextTypes(lastType) {
  if (lastType === "in" || lastType === "break_end") { return ["out", "break_start"]; }
  if (lastType === "break_start") { return ["break_end"]; }
  return ["in"]; // lastTypeがnull、または"out"（退勤済み）
}

function applyButtonState(lastType) {
  currentLastType = lastType;
  var allowed = allowedNextTypes(lastType);
  document.getElementById("btn-in").disabled = allowed.indexOf("in") === -1;
  document.getElementById("btn-out").disabled = allowed.indexOf("out") === -1;
  document.getElementById("btn-break-start").disabled = allowed.indexOf("break_start") === -1;
  document.getElementById("btn-break-end").disabled = allowed.indexOf("break_end") === -1;
}

function todayDateStr() {
  var now = new Date();
  if (typeof dateKey === "function") { return dateKey(now.getFullYear(), now.getMonth(), now.getDate()); }
  return now.getFullYear() + "-" + ("0" + (now.getMonth() + 1)).slice(-2) + "-" + ("0" + now.getDate()).slice(-2);
}

// 指定した人の「今日の直近の打刻の種類」を、サーバー側の記録と
// まだ送信できていないオフラインキューの両方から判定する
async function getLastPunchType(name) {
  var candidates = [];
  if (TORIYAMA_DB.isConfigured() && navigator.onLine) {
    try {
      var employee = await resolveEmployee(name);
      if (employee) {
        var rows = await TORIYAMA_DB.fetchPunchesForDate([employee.id], todayDateStr());
        rows.forEach(function (r) { candidates.push({ type: r.type, at: r.punched_at }); });
      }
    } catch (e) { /* 取得に失敗してもキューの情報だけで判定を続ける */ }
  }
  var queue = getJSON(queueKey, []);
  queue.forEach(function (item) {
    if (item.name === name) { candidates.push({ type: item.type, at: item.punchedAt }); }
  });
  if (!candidates.length) { return null; }
  candidates.sort(function (a, b) { return new Date(a.at) - new Date(b.at); });
  return candidates[candidates.length - 1].type;
}

async function refreshButtonStateForCurrentName() {
  var name = document.getElementById("punch-name").value;
  if (!name) { applyButtonState(null); setButtonsEnabled(false); return; }
  setButtonsEnabled(false);
  var lastType = await getLastPunchType(name);
  applyButtonState(lastType);
}

var PUNCH_TYPE_LABELS = { in: "出勤", out: "退勤", break_start: "休憩", break_end: "休憩戻り" };

// ============================================================
// モードA: Supabase未設定 → 従来どおりlocalStorageのみの簡易デモ
// ============================================================
function legacyPunch(name, type) {
  var typeLabel = PUNCH_TYPE_LABELS[type] || type;
  var log = getJSON(localLogKey, []);
  log.push({ name: name, type: typeLabel, time: timeNow() });
  setJSON(localLogKey, log);
  renderLog();
  showResult(name, typeLabel, false);
}

// ============================================================
// モードB: Supabase設定済み → クラウド保存＋オフラインキュー
// （company_idスコープの解決はsupabase-client.js側で行う。ここでは呼ぶだけ）
// ============================================================
async function getStoreId() {
  return await TORIYAMA_DB.getStoreId(STORE_CODE);
}

async function resolveEmployee(name) {
  var cache = getJSON(employeeCacheKey, {});
  // 従業員が登録し直されるとIDが変わることがある（キャッシュが古いままだと
  // 永久にFK違反で打刻が失敗し続けるバグの原因になっていたため、オンライン時は
  // 必ずSupabaseに最新のIDを確認しにいく。オフライン時のみキャッシュにフォールバック）
  if (navigator.onLine) {
    var employee = await TORIYAMA_DB.findEmployeeByName(name);
    if (employee) {
      cache[name] = { id: employee.id, name: employee.name };
      setJSON(employeeCacheKey, cache);
      return cache[name];
    }
  }
  if (cache[name]) { return cache[name]; }
  return null;
}

async function flushQueue() {
  if (!navigator.onLine) { return; }
  var c = TORIYAMA_DB.getClient();
  if (!c) { return; }
  var queue = getJSON(queueKey, []);
  if (!queue.length) { updateConnStatus(); return; }
  var remaining = [];
  var syncedClientIds = [];
  for (var i = 0; i < queue.length; i++) {
    var item = queue[i];
    var employeeId = item.employeeId;
    // キュー投入時点のemployeeIdが古い可能性があるので、名前が分かっていれば
    // 再送信のたびに最新のIDへ解決し直す（古いIDのまま永久に失敗し続けるのを防ぐ）
    if (item.name) {
      var fresh = await resolveEmployee(item.name);
      if (fresh) { employeeId = fresh.id; }
    }
    if (!employeeId || !item.storeId) { remaining.push(item); continue; }
    var res = await TORIYAMA_DB.insertPunch(employeeId, item.storeId, item.type, item.punchedAt, "button");
    if (res.error) {
      remaining.push(item);
    } else if (item.clientId) {
      syncedClientIds.push(item.clientId);
    }
  }
  setJSON(queueKey, remaining);
  // 同期に成功した打刻は、ログ一覧に残っている「同期待ち」表示も消す
  if (syncedClientIds.length) {
    var log = getJSON(localLogKey, []);
    log.forEach(function (entry) {
      if (entry.clientId && syncedClientIds.indexOf(entry.clientId) !== -1) { entry.queued = false; }
    });
    setJSON(localLogKey, log);
    renderLog();
  }
  updateConnStatus();
}

function updateConnStatus() {
  var el = document.getElementById("conn-status");
  if (!TORIYAMA_DB.isConfigured()) { el.textContent = ""; return; }
  var queueLen = getJSON(queueKey, []).length;
  if (!navigator.onLine) {
    el.textContent = "オフライン（打刻はこの端末に保存されています。復旧後に自動送信）";
  } else if (queueLen > 0) {
    el.textContent = "未送信の打刻が " + queueLen + " 件あります（同期中…）";
  } else {
    el.textContent = "オンライン・同期済み";
  }
}

async function cloudPunch(name, type) {
  var typeLabel = PUNCH_TYPE_LABELS[type] || type;
  var nowIso = new Date().toISOString();
  var clientId = Date.now() + "_" + Math.random().toString(36).slice(2);

  var employee = await resolveEmployee(name);
  var storeId = await getStoreId();
  var queued = true;

  if (employee && navigator.onLine && storeId) {
    var res = await TORIYAMA_DB.insertPunch(employee.id, storeId, type, nowIso, "button");
    queued = !!res.error;
  }
  if (queued) {
    var q = getJSON(queueKey, []);
    q.push({ employeeId: employee ? employee.id : null, storeId: storeId, type: type, punchedAt: nowIso, name: name, clientId: clientId });
    setJSON(queueKey, q);
  }

  var log = getJSON(localLogKey, []);
  log.push({ name: name, type: typeLabel, time: timeNow(), queued: queued, clientId: clientId });
  setJSON(localLogKey, log);

  renderLog();
  updateConnStatus();
  showResult(name, typeLabel, queued);
}

// ============================================================
// 共通の画面制御
// ============================================================
function doPunch(type) {
  var name = document.getElementById("punch-name").value;
  if (!name) { return; }
  // 二度打ち防止：今許可されていないボタンなら何もしない（念のための二重チェック）
  if (allowedNextTypes(currentLastType).indexOf(type) === -1) { return; }
  setButtonsEnabled(false);
  var finish = function () { applyButtonState(type); };
  if (TORIYAMA_DB.isConfigured()) {
    cloudPunch(name, type).then(finish);
  } else {
    legacyPunch(name, type);
    finish();
  }
}

document.getElementById("punch-name").addEventListener("change", function () {
  refreshButtonStateForCurrentName();
});

window.addEventListener("online", function () { updateConnStatus(); flushQueue(); });
window.addEventListener("offline", updateConnStatus);

// ============================================================
// 起動処理：店舗設定済みなら打刻画面へ、未設定なら店舗設定画面を表示
// ============================================================
populateSetupStoreSelect();
var savedStore = localStorage.getItem(terminalStoreKey);
if (savedStore && STORE_LIST.indexOf(savedStore) !== -1) {
  startPunchScreen(savedStore);
} else {
  document.getElementById("setup-area").style.display = "block";
}
</script>
</body>
</html>
