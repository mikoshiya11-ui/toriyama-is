<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打刻 | 鳥やま 社内システム</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
  <img src="../assets/logo.png" alt="鳥やま" class="logo" style="width:64px;margin-bottom:24px;">
  <span class="demo-tag" id="mode-tag">テスト版</span>
  <p class="page-note" id="conn-status" style="margin-bottom:8px;"></p>
  <h1 class="page-title">打刻</h1>
  <p class="page-note" style="margin-bottom:16px;">お名前を選んで、出勤・退勤・休憩のボタンを押してください</p>

  <div class="step" style="width:288px;">
    <select class="field" id="punch-name">
      <option value="">お名前を選択</option>
    </select>

    <div class="punch-btn-row">
      <div class="punch-btn-col">
        <button type="button" class="punch-btn punch-in" id="btn-in" onclick="doPunch('in')" disabled>出勤</button>
        <button type="button" class="punch-btn-half punch-break-start" id="btn-break-start" onclick="doPunch('break_start')" disabled>休憩</button>
      </div>
      <div class="punch-btn-col">
        <button type="button" class="punch-btn punch-out" id="btn-out" onclick="doPunch('out')" disabled>退勤</button>
        <button type="button" class="punch-btn-half punch-break-end" id="btn-break-end" onclick="doPunch('break_end')" disabled>休憩戻り</button>
      </div>
    </div>

    <div id="result-area" class="card-result" style="display:none;">
      <p class="card-result-name" id="result-name"></p>
      <p class="card-result-sub" id="result-sub"></p>
    </div>

    <p class="page-note" style="margin:24px 0 8px;text-align:left;">直近の打刻ログ</p>
    <div id="log-list"></div>
  </div>

  <a class="back" href="kintai.html">勤怠管理へ戻る</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-client.js"></script>
<script src="../shift-utils.js"></script>
<script>
/*
  この端末が固定されている店舗コード／店舗名。
  設置時に v2/supabase/schema.sql の stores.code と合わせて設定する。
  （打刻端末は店舗を選択させない仕様のため、ここで固定する）
*/
var STORE_CODE = "shinanjo";
var STORE_NAME = "新安城店";

function populateNameSelect() {
  var sel = document.getElementById("punch-name");
  (STORE_STAFF[STORE_NAME] || []).forEach(function (name) {
    var o = document.createElement("option");
    o.value = name;
    o.textContent = name + (isShain(name) ? "（社員）" : "（バイト）");
    sel.appendChild(o);
  });
}

// ---- ローカル（レガシー/オフライン共通）ストレージ ----
var localLogKey = "toriyama_kintai_log";       // 画面表示用の打刻ログ（両モード共通）
var employeeCacheKey = "toriyama_employee_cache"; // Supabaseから解決した従業員IDのキャッシュ（名前→employee）
var queueKey = "toriyama_punch_queue";         // 未送信の打刻キュー

function getJSON(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
  catch (e) { return fallback; }
}
function setJSON(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function timeNow() {
  var d = new Date();
  return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}

function renderLog() {
  var log = getJSON(localLogKey, []);
  var el = document.getElementById("log-list");
  el.innerHTML = "";
  var recent = log.slice(-6).reverse();
  if (recent.length === 0) {
    el.innerHTML = '<p class="page-note">まだ打刻がありません</p>';
    return;
  }
  for (var i = 0; i < recent.length; i++) {
    var row = document.createElement("div");
    row.className = "log-row";
    var suffix = recent[i].queued ? "（同期待ち）" : "";
    row.innerHTML = "<span>" + recent[i].name + "　" + recent[i].type + suffix + "</span><span>" + recent[i].time + "</span>";
    el.appendChild(row);
  }
}

function showResult(name, typeLabel, queued) {
  var resultArea = document.getElementById("result-area");
  resultArea.style.display = "block";
  document.getElementById("result-name").textContent = name + "　" + typeLabel;
  document.getElementById("result-sub").textContent = timeNow() + " に記録しました" + (queued ? "（通信復旧後に同期します）" : "");

  setTimeout(function () {
    resultArea.style.display = "none";
  }, 2500);
}

function setButtonsEnabled(enabled) {
  document.getElementById("btn-in").disabled = !enabled;
  document.getElementById("btn-out").disabled = !enabled;
  document.getElementById("btn-break-start").disabled = !enabled;
  document.getElementById("btn-break-end").disabled = !enabled;
}

var PUNCH_TYPE_LABELS = { in: "出勤", out: "退勤", break_start: "休憩", break_end: "休憩戻り" };

// ============================================================
// モードA: Supabase未設定 → 従来どおりlocalStorageのみの簡易デモ
// ============================================================
function legacyPunch(name, type) {
  var typeLabel = PUNCH_TYPE_LABELS[type] || type;
  var log = getJSON(localLogKey, []);
  log.push({ name: name, type: typeLabel, time: timeNow() });
  setJSON(localLogKey, log);
  renderLog();
  showResult(name, typeLabel, false);
}

// ============================================================
// モードB: Supabase設定済み → クラウド保存＋オフラインキュー
// （company_idスコープの解決はsupabase-client.js側で行う。ここでは呼ぶだけ）
// ============================================================
async function getStoreId() {
  return await TORIYAMA_DB.getStoreId(STORE_CODE);
}

async function resolveEmployee(name) {
  var cache = getJSON(employeeCacheKey, {});
  if (cache[name]) { return cache[name]; }
  if (!navigator.onLine) { return null; }
  var employee = await TORIYAMA_DB.findEmployeeByName(name);
  if (employee) {
    cache[name] = { id: employee.id, name: employee.name };
    setJSON(employeeCacheKey, cache);
    return cache[name];
  }
  return null;
}

async function flushQueue() {
  if (!navigator.onLine) { return; }
  var c = TORIYAMA_DB.getClient();
  if (!c) { return; }
  var queue = getJSON(queueKey, []);
  if (!queue.length) { updateConnStatus(); return; }
  var remaining = [];
  for (var i = 0; i < queue.length; i++) {
    var item = queue[i];
    var res = await TORIYAMA_DB.insertPunch(item.employeeId, item.storeId, item.type, item.punchedAt, "button");
    if (res.error) { remaining.push(item); }
  }
  setJSON(queueKey, remaining);
  updateConnStatus();
}

function updateConnStatus() {
  var el = document.getElementById("conn-status");
  if (!TORIYAMA_DB.isConfigured()) { el.textContent = ""; return; }
  var queueLen = getJSON(queueKey, []).length;
  if (!navigator.onLine) {
    el.textContent = "オフライン（打刻はこの端末に保存されています。復旧後に自動送信）";
  } else if (queueLen > 0) {
    el.textContent = "未送信の打刻が " + queueLen + " 件あります（同期中…）";
  } else {
    el.textContent = "オンライン・同期済み";
  }
}

async function cloudPunch(name, type) {
  var typeLabel = PUNCH_TYPE_LABELS[type] || type;
  var nowIso = new Date().toISOString();

  var employee = await resolveEmployee(name);
  var storeId = await getStoreId();
  var queued = true;

  if (employee && navigator.onLine && storeId) {
    var res = await TORIYAMA_DB.insertPunch(employee.id, storeId, type, nowIso, "button");
    queued = !!res.error;
  }
  if (queued) {
    var q = getJSON(queueKey, []);
    q.push({ employeeId: employee ? employee.id : null, storeId: storeId, type: type, punchedAt: nowIso, name: name });
    setJSON(queueKey, q);
  }

  var log = getJSON(localLogKey, []);
  log.push({ name: name, type: typeLabel, time: timeNow(), queued: queued });
  setJSON(localLogKey, log);

  renderLog();
  updateConnStatus();
  showResult(name, typeLabel, queued);
}

// ============================================================
// 共通の画面制御
// ============================================================
function doPunch(type) {
  var name = document.getElementById("punch-name").value;
  if (!name) { return; }
  setButtonsEnabled(false);
  var finish = function () { setButtonsEnabled(true); };
  if (TORIYAMA_DB.isConfigured()) {
    cloudPunch(name, type).then(finish);
  } else {
    legacyPunch(name, type);
    finish();
  }
}

document.getElementById("punch-name").addEventListener("change", function () {
  setButtonsEnabled(!!this.value);
});

populateNameSelect();

document.getElementById("mode-tag").textContent = TORIYAMA_DB.isConfigured()
  ? "Supabase連携・オフライン対応"
  : "テスト版（ローカル保存のみ）";

window.addEventListener("online", function () { updateConnStatus(); flushQueue(); });
window.addEventListener("offline", updateConnStatus);

renderLog();
updateConnStatus();
if (TORIYAMA_DB.isConfigured()) {
  flushQueue();
  setInterval(flushQueue, 30000);
}
</script>
</body>
</html>
