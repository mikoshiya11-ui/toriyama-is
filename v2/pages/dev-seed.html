<html lang="ja">
<head>

<link rel="stylesheet" href="../style.css">

<body>
<div class="wrap">
  <img src="../assets/logo.png" alt="鳥やま" class="logo" style="width:64px;margin-bottom:24px;">
  <span class="demo-tag">開発用ツール</span>
  <h1 class="page-title">デモデータ投入</h1>
  <p class="page-note" style="margin-bottom:20px;">
    localStorageは端末・ブラウザごとに独立しているため、このボタンは「今この画面を開いているブラウザ」にだけデータを投入します。
    スマホで確認したい場合は、スマホ側でこのページを開いてボタンを押してください。
  </p>

  <div class="step" style="width:320px;">
    <p class="page-note" style="text-align:left;margin-bottom:12px;">新安城店 4名（田中・山田・高橋・中島）の2026年8月の希望シフトを投入します（申請データのみ。確定は別途admin-shift.htmlで行います）。</p>
    <button class="nav-btn" style="width:100%;" onclick="seedData()">新安城店・8月の希望シフトを投入する</button>
    <p class="confirm-msg" id="confirm-msg" style="display:none;">投入しました。下のリンクから確認できます。</p>
  </div>

  <div class="nav" style="width:320px;margin-top:24px;">
    <a class="nav-btn" href="admin-shift.html">シフト確定（管理者）で見る</a>
    <a class="nav-btn" href="shift-confirm.html">確定シフト確認（スタッフ）で見る</a>
    <a class="nav-btn" href="shift-submit.html">希望シフト送信（スタッフ）で見る</a>
  </div>

  <a class="back" href="../admin.html">管理者ダッシュボードへ戻る</a>
</div>

    "2026-08-28": { requested: true, start: "13:00", end: "24:00" },

  },
  "山田": {

    "2026-08-28": { requested: true, start: "17:00", end: "23:00" },
    "2026-08-29": { requested: true, start: "13:00", end: "24:00" },
    "2026-08-30": { requested: true, start: "17:00", end: "23:00" }
  }
};

function seedData() {
  var existing = {};
  try { existing = JSON.parse(localStorage.getItem(requestsKey) || "{}"); }
  catch (e) { existing = {}; }

  for (var name in SEED_DATA) {
    if (!existing[name]) { existing[name] = {}; }
    for (var dateKey in SEED_DATA[name]) {
      existing[name][dateKey] = SEED_DATA[name][dateKey];
    }
  }

  localStorage.setItem(requestsKey, JSON.stringify(existing));
  document.getElementById("confirm-msg").style.display = "block";
}
