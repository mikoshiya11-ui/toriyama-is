<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在庫管理（管理者） | 鳥やま 社内システム</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="admin-wrap" style="max-width:480px;">
  <img src="../assets/logo.png" alt="鳥やま" class="logo" style="width:64px;margin-bottom:16px;">
  <span class="demo-tag">実棚卸データ・2026年4-5月分</span>
  <h1 class="page-title">在庫管理（管理者）</h1>
  <p class="page-note" style="margin-bottom:12px;">品目ごとに数量と発注点を設定できます。発注点を設定すると、その数量以下になった時点でスタッフ側の在庫管理にアラームが出ます。</p>

  <select class="field" id="store-select" onchange="render()">
    <option>餃子酒場さんちょうめ</option>
    <option>鳥料理と炭火焼 鶏やま</option>
    <option>Tripot cafe BAKE stand</option>
    <option>Tripot cafe FOOD truck</option>
    <option>本部</option>
  </select>

  <div class="zaiko-toolrow">
    <input class="field" id="search-input" type="text" placeholder="品目名または品番で絞り込み" oninput="render()" style="margin-bottom:0;">
    <label class="zaiko-check-row">
      <input type="checkbox" id="low-only-check" onchange="render()"> アラーム品目のみ表示
    </label>
  </div>

  <p class="zaiko-summary" id="summary-line"></p>

  <div class="step" id="stock-area" style="width:100%;">
    <p class="page-note">読み込み中...</p>
  </div>

  <a class="back" href="../admin.html">管理者ダッシュボードへ戻る</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-client.js"></script>
<script src="../shift-utils.js"></script>
<script src="../zaiko-utils.js"></script>
<script>
function currentStore() {
  return document.getElementById("store-select").value;
}

function allEffectiveItems(store) {
  var cats = ITEM_MASTER[store] || [];
  var out = [];
  cats.forEach(function (cat) {
    cat.items.forEach(function (masterItem) {
      out.push(getEffectiveItem(store, masterItem));
    });
  });
  return out;
}

function updateSummary(store) {
  var all = allEffectiveItems(store);
  var lowCount = all.filter(isLowStock).length;
  var el = document.getElementById("summary-line");
  if (!all.length) {
    el.textContent = "この店舗の品目データはまだありません";
    return;
  }
  el.innerHTML = "全 " + all.length + " 品目 / うち発注点以下 <span class=\"low-count\">" + lowCount + "</span> 件";
}

function buildRow(store, masterItem, category) {
  var item = getEffectiveItem(store, masterItem);

  var row = document.createElement("div");
  row.className = "stock-row" + (isLowStock(item) ? " low-stock" : "");

  var top = document.createElement("div");
  top.className = "stock-top";
  var nameSpan = document.createElement("span");
  nameSpan.textContent = item.name;
  var costSpan = document.createElement("span");
  costSpan.className = "stock-qty";
  costSpan.textContent = "単価" + item.unitPrice.toLocaleString() + " / 原価" + Math.round(item.qty * item.unitPrice).toLocaleString();
  top.appendChild(nameSpan);
  top.appendChild(costSpan);

  var fields = document.createElement("div");
  fields.className = "stock-fields";

  var qtyLabel = document.createElement("label");
  qtyLabel.textContent = "数量";
  var qtyInput = document.createElement("input");
  qtyInput.className = "stock-num";
  qtyInput.type = "number";
  qtyInput.step = "0.01";
  qtyInput.value = item.qty;
  qtyLabel.appendChild(qtyInput);

  var rpLabel = document.createElement("label");
  rpLabel.textContent = "発注点";
  var rpInput = document.createElement("input");
  rpInput.className = "stock-num";
  rpInput.type = "number";
  rpInput.step = "0.01";
  rpInput.value = item.reorderPoint;
  rpLabel.appendChild(rpInput);

  var lowTag = document.createElement("span");
  lowTag.className = "low-tag";
  lowTag.textContent = "要発注";
  lowTag.style.display = isLowStock(item) ? "inline-block" : "none";

  function commit() {
    var qty = parseFloat(qtyInput.value);
    var rp = parseFloat(rpInput.value);
    if (isNaN(qty)) { qty = 0; }
    if (isNaN(rp)) { rp = 0; }
    setItemState(store, masterItem.name, { qty: qty, reorderPoint: rp });
    var updated = getEffectiveItem(store, masterItem);
    row.classList.toggle("low-stock", isLowStock(updated));
    lowTag.style.display = isLowStock(updated) ? "inline-block" : "none";
    costSpan.textContent = "単価" + updated.unitPrice.toLocaleString() + " / 原価" + Math.round(updated.qty * updated.unitPrice).toLocaleString();
    updateSummary(store);
    pushZaikoItemState(store, masterItem, category);
  }

  qtyInput.addEventListener("change", commit);
  rpInput.addEventListener("change", commit);

  fields.appendChild(qtyLabel);
  fields.appendChild(rpLabel);
  fields.appendChild(lowTag);

  row.appendChild(top);
  row.appendChild(fields);
  return row;
}

function render() {
  var store = currentStore();
  var query = document.getElementById("search-input").value.trim().toLowerCase();
  var lowOnly = document.getElementById("low-only-check").checked;
  var cats = ITEM_MASTER[store] || [];
  var area = document.getElementById("stock-area");
  area.innerHTML = "";

  updateSummary(store);

  if (!cats.length) {
    area.innerHTML = '<p class="page-note">この店舗の品目データはまだありません（Excel側にも該当データがないため）</p>';
    return;
  }

  var anyShown = false;
  cats.forEach(function (cat) {
    var shownItems = cat.items.filter(function (masterItem) {
      if (query) {
        var nameMatch = masterItem.name.toLowerCase().indexOf(query) !== -1;
        var codeMatch = masterItem.code && masterItem.code.toLowerCase().indexOf(query) !== -1;
        if (!nameMatch && !codeMatch) { return false; }
      }
      if (lowOnly && !isLowStock(getEffectiveItem(store, masterItem))) { return false; }
      return true;
    });
    if (!shownItems.length) { return; }
    anyShown = true;

    var catEl = document.createElement("p");
    catEl.className = "stock-cat";
    catEl.textContent = cat.cat;
    area.appendChild(catEl);

    shownItems.forEach(function (masterItem) {
      area.appendChild(buildRow(store, masterItem, cat.cat));
    });
  });

  if (!anyShown) {
    area.innerHTML += '<p class="page-note">該当する品目がありません</p>';
  }
}

(async function init() {
  document.getElementById("stock-area").innerHTML = '<p class="page-note">読み込み中...</p>';
  await syncZaikoStateFromSupabase();
  render();
})();
</script>
</body>
</html>
