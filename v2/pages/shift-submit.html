<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>希望シフト送信 | 鳥やま 社内システム</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
  <img src="../assets/logo.png" alt="鳥やま" class="logo" style="width:64px;margin-bottom:24px;">
  <span class="demo-tag">テスト版・仮データ</span>
  <h1 class="page-title">希望シフト送信</h1>
  <p class="page-note" style="margin-bottom:16px;">日付をタップして、働ける日と時間を入力してください</p>

  <select class="field" id="store-select" onchange="onStoreChange()" style="width:336px;">
    <option value="">店舗を選択</option>
    <option>餃子酒場さんちょうめ</option>
    <option>鳥料理と炭火焼 鶏やま</option>
    <option>Tripot cafe BAKE stand</option>
    <option>Tripot cafe FOOD truck</option>
    <option>本部</option>
  </select>

  <select class="field" id="staff-name" onchange="onNameChange()" style="width:336px;" disabled>
    <option value="">先に店舗を選択</option>
  </select>

  <div class="shift-cal-nav">
    <button class="nav-btn" style="padding:8px 12px;" onclick="changeMonth(-1)">◀</button>
    <span id="month-label" style="font-size:13px;letter-spacing:1px;"></span>
    <button class="nav-btn" style="padding:8px 12px;" onclick="changeMonth(1)">▶</button>
  </div>

  <div class="shift-cal-grid" id="cal-grid"></div>

  <div class="shift-cal-editor" id="editor" style="display:none;">
    <p class="shift-cal-editor-title" id="editor-title"></p>
    <div class="day-row">
      <label><input type="checkbox" id="editor-requested" onchange="toggleEditorFields()"> 出勤希望あり</label>
    </div>
    <div id="editor-free-row" class="day-row" style="display:none;">
      <label><input type="checkbox" id="editor-free" onchange="toggleFreeFields()"> この日は時間フリーで入れます</label>
    </div>
    <div id="editor-time-row">
      <div class="shift-cal-pattern-row" id="pattern-row"></div>
      <div class="day-row">
        <select class="field" id="editor-start" onchange="renderPatternButtons()"></select>
        <span>〜</span>
        <select class="field" id="editor-end" onchange="renderPatternButtons()"></select>
      </div>
    </div>
    <button class="nav-btn" style="width:100%;" onclick="saveDay()">この日を申請</button>
    <button class="nav-btn" id="cancel-btn" style="width:100%;margin-top:8px;background:#fff;color:#993556;border:1px solid #993556;display:none;" onclick="cancelDay()">この日の希望を取り消す</button>
  </div>

  <p class="confirm-msg" id="confirm-msg" style="display:none;"></p>

  <a class="back" href="kintai-shift.html">シフト管理へ戻る</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-client.js"></script>
<script src="../staff-utils.js"></script>
<script src="../shift-utils.js"></script>
<script>
var requestsKey = "toriyama_shift_requests_month";

// よく使う勤務時間パターン（鳥やまの実際のシフト帯に合わせたもの）
var PATTERNS = [
  { start: "13:00", end: "24:00" },
  { start: "15:00", end: "23:00" },
  { start: "17:00", end: "22:00" },
  { start: "17:00", end: "23:00" }
];

function buildTimeOptions(selectEl, selected) {
  selectEl.innerHTML = "";
  for (var h = 0; h <= 24; h += 0.5) {
    var label = hourToLabel(h);
    var opt = document.createElement("option");
    opt.value = label;
    opt.textContent = label;
    if (label === selected) { opt.selected = true; }
    selectEl.appendChild(opt);
  }
}

function applyPattern(start, end) {
  document.getElementById("editor-requested").checked = true;
  toggleEditorFields();
  document.getElementById("editor-start").value = start;
  document.getElementById("editor-end").value = end;
  renderPatternButtons();
}

function renderPatternButtons() {
  var row = document.getElementById("pattern-row");
  var curStart = document.getElementById("editor-start").value;
  var curEnd = document.getElementById("editor-end").value;
  row.innerHTML = "";
  PATTERNS.forEach(function (p) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "shift-cal-pattern-btn" + (p.start === curStart && p.end === curEnd ? " active" : "");
    btn.textContent = p.start + "〜" + p.end;
    btn.onclick = function () { applyPattern(p.start, p.end); };
    row.appendChild(btn);
  });
}

var today = new Date();
var base = new Date(today.getFullYear(), today.getMonth() + 1, 1); // 来月分をデフォルトで表示
var curYear = base.getFullYear();
var curMonthIdx = base.getMonth();
var selectedDateKey = null;

function getRequests() {
  try { return JSON.parse(localStorage.getItem(requestsKey) || "{}"); }
  catch (e) { return {}; }
}
function saveRequests(r) {
  localStorage.setItem(requestsKey, JSON.stringify(r));
}

function currentName() {
  return document.getElementById("staff-name").value;
}

async function changeMonth(delta) {
  var d = new Date(curYear, curMonthIdx + delta, 1);
  curYear = d.getFullYear();
  curMonthIdx = d.getMonth();
  selectedDateKey = null;
  document.getElementById("editor").style.display = "none";
  renderCalendar();
  var store = document.getElementById("store-select").value;
  var synced = await syncShiftRequestsFromSupabase(store, curYear, curMonthIdx);
  if (synced) { renderCalendar(); }
}

async function onStoreChange() {
  var store = document.getElementById("store-select").value;
  var nameSel = document.getElementById("staff-name");
  nameSel.innerHTML = "";

  if (!store) {
    nameSel.disabled = true;
    var opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "先に店舗を選択";
    nameSel.appendChild(opt);
  } else {
    nameSel.disabled = false;
    var placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "お名前を選択";
    nameSel.appendChild(placeholder);
    getStoreStaffNames(store).forEach(function (name) {
      var o = document.createElement("option");
      o.value = name;
      o.textContent = name + employmentSuffixLabel(name);
      nameSel.appendChild(o);
    });
  }
  onNameChange();
  var synced = await syncShiftRequestsFromSupabase(store, curYear, curMonthIdx);
  if (synced) { renderCalendar(); }
}

function onNameChange() {
  selectedDateKey = null;
  document.getElementById("editor").style.display = "none";
  renderCalendar();
}

function renderCalendar() {
  document.getElementById("month-label").textContent = monthLabel(curYear, curMonthIdx);
  var grid = document.getElementById("cal-grid");
  grid.innerHTML = "";
  SHIFT_DAYS.forEach(function (d) {
    var h = document.createElement("div");
    h.className = "shift-cal-headcell";
    h.textContent = d;
    grid.appendChild(h);
  });

  var name = currentName();
  var requests = getRequests();
  var record = (name && requests[name]) ? requests[name] : {};
  var numDays = daysInMonth(curYear, curMonthIdx);
  var firstDay = new Date(curYear, curMonthIdx, 1);
  var leadingBlanks = jsDayToShiftIndex(firstDay.getDay());

  for (var i = 0; i < leadingBlanks; i++) {
    var blank = document.createElement("div");
    blank.className = "shift-cal-cell blank";
    grid.appendChild(blank);
  }

  for (var day = 1; day <= numDays; day++) {
    var dKey = dateKey(curYear, curMonthIdx, day);
    var entry = record[dKey];
    var cell = document.createElement("div");
    cell.className = "shift-cal-cell" + (entry && entry.requested ? " has-request" : "") + (dKey === selectedDateKey ? " selected" : "");
    cell.dataset.datekey = dKey;
    var timeLabel = "";
    if (entry && entry.requested) {
      timeLabel = entry.free ? "フリー" : (entry.start + "<br>" + entry.end);
    }
    cell.innerHTML = day + (timeLabel ? '<span class="cal-time">' + timeLabel + '</span>' : "");
    cell.onclick = function () { openEditor(this.dataset.datekey); };
    grid.appendChild(cell);
  }
}

function openEditor(dKey) {
  var name = currentName();
  if (!name) {
    document.getElementById("confirm-msg").style.color = "#993556";
    document.getElementById("confirm-msg").textContent = "先にお名前を選択してください";
    document.getElementById("confirm-msg").style.display = "block";
    return;
  }
  document.getElementById("confirm-msg").style.display = "none";
  selectedDateKey = dKey;
  renderCalendar();

  var requests = getRequests();
  var entry = (requests[name] && requests[name][dKey]) || { requested: false, free: false, start: "17:00", end: "22:00" };

  var dayNum = Number(dKey.split("-")[2]);
  var d = new Date(curYear, curMonthIdx, dayNum);
  document.getElementById("editor-title").textContent = (curMonthIdx + 1) + "月" + dayNum + "日（" + SHIFT_DAYS[jsDayToShiftIndex(d.getDay())] + "）";
  document.getElementById("editor-requested").checked = !!entry.requested;
  document.getElementById("editor-free").checked = !!entry.free;

  var startSel = document.getElementById("editor-start");
  var endSel = document.getElementById("editor-end");
  buildTimeOptions(startSel, entry.start || "17:00");
  buildTimeOptions(endSel, entry.end || "22:00");

  toggleEditorFields();
  renderPatternButtons();
  document.getElementById("cancel-btn").style.display = entry.requested ? "block" : "none";
  document.getElementById("editor").style.display = "block";
}

function toggleEditorFields() {
  var on = document.getElementById("editor-requested").checked;
  document.getElementById("editor-free-row").style.display = on ? "block" : "none";
  toggleFreeFields();
}

// 「この日は時間フリーで入れます」がオンの間は、時間帯の指定は不要なので隠す
function toggleFreeFields() {
  var requestedOn = document.getElementById("editor-requested").checked;
  var freeOn = document.getElementById("editor-free").checked;
  document.getElementById("editor-time-row").style.display = (requestedOn && !freeOn) ? "block" : "none";
}

async function saveDay() {
  var name = currentName();
  var store = document.getElementById("store-select").value;
  if (!name || !selectedDateKey) { return; }

  var requests = getRequests();
  if (!requests[name]) { requests[name] = {}; }

  var requested = document.getElementById("editor-requested").checked;
  var free = requested && document.getElementById("editor-free").checked;
  var entry = {
    requested: requested,
    free: free,
    start: (requested && !free) ? document.getElementById("editor-start").value : "",
    end: (requested && !free) ? document.getElementById("editor-end").value : ""
  };
  requests[name][selectedDateKey] = entry;
  saveRequests(requests);

  var msg = document.getElementById("confirm-msg");
  msg.style.color = "";
  msg.textContent = selectedDateKey + " の希望を申請しました";
  msg.style.display = "block";
  renderCalendar();

  await pushSingleShiftRequest(store, name, selectedDateKey, entry);
}

// 一度申請した希望シフトを取り消す（requested:falseで上書き保存し、Supabaseにも反映）
async function cancelDay() {
  var name = currentName();
  var store = document.getElementById("store-select").value;
  if (!name || !selectedDateKey) { return; }
  var dKey = selectedDateKey;

  var requests = getRequests();
  if (!requests[name]) { requests[name] = {}; }

  var entry = { requested: false, free: false, start: "", end: "" };
  requests[name][dKey] = entry;
  saveRequests(requests);

  var msg = document.getElementById("confirm-msg");
  msg.style.color = "";
  msg.textContent = dKey + " の希望を取り消しました";
  msg.style.display = "block";

  document.getElementById("editor").style.display = "none";
  selectedDateKey = null;
  renderCalendar();

  await pushSingleShiftRequest(store, name, dKey, entry);
}

(async function init() {
  await syncStaffRosterFromSupabase();
  renderCalendar();
})();
</script>
</body>
</html>
