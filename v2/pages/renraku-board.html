<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>掲示板 | 鳥やま 社内システム</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
  <img src="../assets/logo.png" alt="鳥やま" class="logo" style="width:64px;margin-bottom:24px;">
  <h1 class="page-title">掲示板</h1>

  <select class="field" id="store-select" onchange="onStoreChange()" style="width:288px;">
    <option value="">店舗を選択</option>
    <option>餃子酒場さんちょうめ</option>
    <option>鳥料理と炭火焼 鶏やま</option>
    <option>Tripot cafe BAKE stand</option>
    <option>Tripot cafe FOOD truck</option>
    <option>本部</option>
  </select>

  <select class="field" id="staff-name" onchange="updatePostState();render();" style="width:288px;margin-bottom:12px;" disabled>
    <option value="">先に店舗を選択</option>
  </select>

  <div class="filter-tabs" style="width:288px;">
    <button class="filter-tab active" id="tab-all" onclick="setFilter('all')">会社全体</button>
    <button class="filter-tab" id="tab-mine" onclick="setFilter('mine')">勤務する店舗</button>
  </div>

  <div class="step post-form" style="width:288px;">
    <p class="page-note" style="text-align:left;margin:0 0 8px;" id="post-store-note">投稿するには、まず上で店舗とお名前を選択してください</p>
    <textarea class="field" id="post-body" placeholder="お知らせ内容を入力"></textarea>
    <input class="field" id="post-image" type="file" accept="image/*" style="padding:8px;">
    <button class="nav-btn" style="width:100%;" id="post-btn" onclick="postNotice()" disabled>この内容で投稿する</button>
  </div>

  <p class="page-note" id="board-error" style="color:#993556;display:none;"></p>

  <div class="step" id="post-list" style="width:288px;"><p class="page-note">読み込み中...</p></div>

  <a class="back" href="staff.html">スタッフメニューへ戻る</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-client.js"></script>
<script src="../shift-utils.js"></script>
<script src="../staff-utils.js"></script>
<script src="../board-utils.js"></script>
<script>
var posts = [];
var filterMode = "all";

function currentName() {
  return document.getElementById("staff-name").value;
}

function currentMyStore() {
  return document.getElementById("store-select").value;
}

function setFilter(mode) {
  filterMode = mode;
  document.getElementById("tab-all").classList.toggle("active", mode === "all");
  document.getElementById("tab-mine").classList.toggle("active", mode === "mine");
  render();
}

function updatePostState() {
  var store = currentMyStore();
  var name = currentName();
  var note = document.getElementById("post-store-note");
  var btn = document.getElementById("post-btn");

  if (store) {
    note.textContent = "投稿は「" + store + "」名義になります（上で選んだ店舗）";
  } else {
    note.textContent = "投稿するには、まず上で店舗とお名前を選択してください";
  }
  btn.disabled = !(store && name);
}

function onStoreChange() {
  var store = document.getElementById("store-select").value;
  var nameSel = document.getElementById("staff-name");
  nameSel.innerHTML = "";

  if (!store) {
    nameSel.disabled = true;
    var opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "先に店舗を選択";
    nameSel.appendChild(opt);
  } else {
    nameSel.disabled = false;
    var placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "お名前を選択";
    nameSel.appendChild(placeholder);
    getStoreStaffNames(store).forEach(function (name) {
      var o = document.createElement("option");
      o.value = name;
      o.textContent = name + (isShain(name) ? "（社員）" : "（バイト）");
      nameSel.appendChild(o);
    });
  }
  updatePostState();
  render();
}

function showError(msg) {
  var el = document.getElementById("board-error");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(function () { el.style.display = "none"; }, 3000);
}

function findEmployeeId(name) {
  var roster = (typeof getStaffRoster === "function") ? getStaffRoster() : [];
  var p = roster.filter(function (r) { return r.name === name; })[0];
  return p ? p.id : null;
}

function render() {
  var myStore = currentMyStore();
  var name = currentName();
  var list = document.getElementById("post-list");
  list.innerHTML = "";

  var visible = posts.filter(function (p) {
    return filterMode === "all" || p.store === myStore;
  });

  if (visible.length === 0) {
    list.innerHTML = '<p class="page-note">お知らせはまだありません</p>';
    return;
  }

  var myId = findEmployeeId(name);

  visible.forEach(function (p) {
    var card = document.createElement("div");
    card.className = "post-card";

    var header = document.createElement("div");
    header.className = "post-header";
    var store = document.createElement("span");
    store.className = "post-store";
    store.textContent = p.store;
    var time = document.createElement("span");
    time.className = "post-time";
    time.textContent = formatBoardTime(p.postedAt);
    header.appendChild(store);
    header.appendChild(time);
    card.appendChild(header);

    if (p.image) {
      var img = document.createElement("img");
      img.src = p.image;
      img.style.cssText = "width:100%;border-radius:4px;margin:0 0 10px;display:block;";
      card.appendChild(img);
    }

    var body = document.createElement("p");
    body.className = "post-body";
    body.textContent = p.body;
    card.appendChild(body);

    var footer = document.createElement("div");
    footer.className = "post-footer";
    var badge = document.createElement("span");
    badge.className = "read-badge";
    badge.textContent = "既読 " + p.readBy.length;
    var alreadyRead = !!(myId && p.readBy.indexOf(myId) !== -1);
    var btn = document.createElement("button");
    btn.className = "read-btn" + (alreadyRead ? " done" : "");
    btn.textContent = alreadyRead ? "既読済み" : "既読にする";
    btn.disabled = !name;
    btn.onclick = async function () {
      if (!name || alreadyRead) { return; }
      btn.disabled = true;
      var ok = await markBoardRead(p.id, name);
      if (ok) {
        var idx = posts.indexOf(p);
        if (idx !== -1 && myId) { posts[idx].readBy.push(myId); }
        render();
      } else {
        btn.disabled = false;
      }
    };
    footer.appendChild(badge);
    footer.appendChild(btn);
    card.appendChild(footer);

    list.appendChild(card);
  });
}

async function refreshBoard() {
  await syncStaffRosterFromSupabase();
  var result = await fetchBoardPosts();
  if (result === null) {
    document.getElementById("post-list").innerHTML = '<p class="page-note">Supabase未設定のため掲示板は表示できません</p>';
    document.getElementById("post-btn").disabled = true;
    return;
  }
  posts = result;
  updatePostState();
  render();
}

async function postNotice() {
  var store = currentMyStore();
  var name = currentName();
  var body = document.getElementById("post-body").value.trim();
  var fileInput = document.getElementById("post-image");
  var file = fileInput.files && fileInput.files[0];
  if (!store || !name || !body) { return; }

  var btn = document.getElementById("post-btn");
  var postedBy = findEmployeeId(name);

  async function submit(imageData) {
    btn.disabled = true;
    btn.textContent = "投稿中...";
    var res = await postBoardMessage(store, body, imageData, postedBy);
    btn.disabled = false;
    btn.textContent = "この内容で投稿する";
    if (res.error) {
      showError("投稿に失敗しました。時間をおいて再度お試しください");
      return;
    }
    document.getElementById("post-body").value = "";
    fileInput.value = "";
    await refreshBoard();
  }

  if (file) {
    var reader = new FileReader();
    reader.onload = function (e) { submit(e.target.result); };
    reader.readAsDataURL(file);
  } else {
    submit(null);
  }
}

refreshBoard();
</script>
</body>
</html>
