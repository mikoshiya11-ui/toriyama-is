<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>掲示板 | 鳥やま 社内システム</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
  <img src="../assets/logo.png" alt="鳥やま" class="logo" style="width:64px;margin-bottom:24px;">
  <span class="demo-tag">テスト版・仮データ</span>
  <h1 class="page-title">掲示板</h1>
  <p class="page-note" style="margin-bottom:16px;">勤務店舗：餃子酒場さんちょうめ（仮設定）</p>

  <div class="filter-tabs" style="width:288px;">
    <button class="filter-tab active" id="tab-all" onclick="setFilter('all')">会社全体</button>
    <button class="filter-tab" id="tab-mine" onclick="setFilter('mine')">勤務する店舗</button>
  </div>

  <div class="step post-form" style="width:288px;">
    <select class="field" id="post-store">
      <option>餃子酒場さんちょうめ</option>
      <option>鳥料理と炭火焼 鶏やま</option>
      <option>Tripot cafe BAKE stand</option>
    </select>
    <textarea class="field" id="post-body" placeholder="お知らせ内容を入力"></textarea>
    <input class="field" id="post-image" type="file" accept="image/*" style="padding:8px;">
    <button class="nav-btn" style="width:100%;" onclick="postNotice()">この内容で投稿する</button>
  </div>

  <div class="step" id="post-list" style="width:288px;"></div>

  <a class="back" href="staff.html">スタッフメニューへ戻る</a>
</div>

<script>
var myStore = "餃子酒場さんちょうめ";
var filterMode = "all";
var totalStaff = 6;
var posts = [
  { store: "鳥料理と炭火焼 鶏やま", time: "14:20", body: "明日の仕込み一部前倒しします。", read: 4 },
  { store: "Tripot cafe BAKE stand", time: "11:05", body: "新人研修の日程共有です。来週火曜17時からお願いします。", read: 6 },
  { store: "餃子酒場さんちょうめ", time: "昨日", body: "土曜のイベント用に炭を多めに用意してください。", read: 5 }
];

function setFilter(mode) {
  filterMode = mode;
  document.getElementById("tab-all").classList.toggle("active", mode === "all");
  document.getElementById("tab-mine").classList.toggle("active", mode === "mine");
  render();
}

function render() {
  var list = document.getElementById("post-list");
  list.innerHTML = "";
  var visible = posts.filter(function (p) {
    return filterMode === "all" || p.store === myStore;
  });

  if (visible.length === 0) {
    list.innerHTML = '<p class="page-note">お知らせはまだありません</p>';
    return;
  }

  for (var i = 0; i < visible.length; i++) {
    (function (p) {
      var card = document.createElement("div");
      card.className = "post-card";

      var header = document.createElement("div");
      header.className = "post-header";
      var store = document.createElement("span");
      store.className = "post-store";
      store.textContent = p.store;
      var time = document.createElement("span");
      time.className = "post-time";
      time.textContent = p.time;
      header.appendChild(store);
      header.appendChild(time);
      card.appendChild(header);

      if (p.image) {
        var img = document.createElement("img");
        img.src = p.image;
        img.style.cssText = "width:100%;border-radius:4px;margin:0 0 10px;display:block;";
        card.appendChild(img);
      }

      var body = document.createElement("p");
      body.className = "post-body";
      body.textContent = p.body;
      card.appendChild(body);

      var footer = document.createElement("div");
      footer.className = "post-footer";
      var badge = document.createElement("span");
      badge.className = "read-badge";
      badge.textContent = "既読 " + p.read + "/" + totalStaff;
      var btn = document.createElement("button");
      btn.className = "read-btn" + (p.readByMe ? " done" : "");
      btn.textContent = p.readByMe ? "既読済み" : "既読にする";
      btn.onclick = function () {
        if (!p.readByMe) {
          p.readByMe = true;
          p.read = Math.min(p.read + 1, totalStaff);
          render();
        }
      };
      footer.appendChild(badge);
      footer.appendChild(btn);
      card.appendChild(footer);

      list.appendChild(card);
    })(visible[i]);
  }
}

function postNotice() {
  var store = document.getElementById("post-store").value;
  var body = document.getElementById("post-body").value;
  var fileInput = document.getElementById("post-image");
  var file = fileInput.files && fileInput.files[0];
  if (!body) { return; }

  function addPost(imageData) {
    posts.unshift({ store: store, time: "たった今", body: body, read: 0, readByMe: false, image: imageData || null });
    document.getElementById("post-body").value = "";
    fileInput.value = "";
    render();
  }

  if (file) {
    var reader = new FileReader();
    reader.onload = function (e) { addPost(e.target.result); };
    reader.readAsDataURL(file);
  } else {
    addPost(null);
  }
}

render();
</script>
</body>
</html>
