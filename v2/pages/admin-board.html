<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>掲示板（管理者） | 鳥やま 社内システム</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
  <img src="../assets/logo.png" alt="鳥やま" class="logo" style="width:64px;margin-bottom:24px;">
  <h1 class="page-title">掲示板（管理者）</h1>
  <p class="page-note" style="margin-bottom:16px;">全店舗のお知らせをまとめて表示します</p>

  <div class="step post-form" style="width:288px;">
    <select class="field" id="post-store" onchange="onPostStoreChange()">
      <option>餃子酒場さんちょうめ</option>
      <option>鳥料理と炭火焼 鶏やま</option>
      <option>Tripot cafe BAKE stand</option>
      <option>Tripot cafe FOOD truck</option>
      <option>Central Kitchen</option>
      <option>本部</option>
    </select>
    <select class="field" id="post-name">
      <option value="">お名前を選択（任意）</option>
    </select>
    <textarea class="field" id="post-body" placeholder="お知らせ内容を入力"></textarea>
    <input class="field" id="post-image" type="file" accept="image/*" style="padding:8px;">
    <button class="nav-btn" style="width:100%;" id="post-btn" onclick="postNotice()">この内容で投稿する</button>
  </div>

  <p class="page-note" id="board-error" style="color:#993556;display:none;"></p>

  <div class="step" id="post-list" style="width:288px;"><p class="page-note">読み込み中...</p></div>

  <a class="back" href="../admin.html">管理者ダッシュボードへ戻る</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-client.js"></script>
<script src="../shift-utils.js"></script>
<script src="../staff-utils.js"></script>
<script src="../board-utils.js"></script>
<script>
var posts = [];
var totalStaff = 0;

function showError(msg) {
  var el = document.getElementById("board-error");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(function () { el.style.display = "none"; }, 3000);
}

function findEmployeeId(name) {
  var roster = (typeof getStaffRoster === "function") ? getStaffRoster() : [];
  var p = roster.filter(function (r) { return r.name === name; })[0];
  return p ? p.id : null;
}

// 投稿する店舗の在籍スタッフを名前プルダウンに反映する（未選択のままでも投稿可＝管理者投稿扱い）
function onPostStoreChange() {
  var store = document.getElementById("post-store").value;
  var sel = document.getElementById("post-name");
  sel.innerHTML = "";
  var placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "お名前を選択（任意）";
  sel.appendChild(placeholder);
  getStoreStaffNames(store).forEach(function (name) {
    var o = document.createElement("option");
    o.value = name;
    o.textContent = name + employmentSuffixLabel(name);
    sel.appendChild(o);
  });
}

// 既読者idの配列を名前の配列に変換する（退職・解除済みで名簿に無い人は除く）
function readerNames(readBy) {
  var roster = (typeof getStaffRoster === "function") ? getStaffRoster() : [];
  var idToName = {};
  roster.forEach(function (p) { idToName[p.id] = p.name; });
  return readBy.map(function (id) { return idToName[id]; }).filter(Boolean);
}

function render() {
  var list = document.getElementById("post-list");
  list.innerHTML = "";

  if (!posts.length) {
    list.innerHTML = '<p class="page-note">お知らせはまだありません</p>';
    return;
  }

  posts.forEach(function (p) {
    var card = document.createElement("div");
    card.className = "post-card";

    var header = document.createElement("div");
    header.className = "post-header";
    var store = document.createElement("span");
    store.className = "post-store";
    store.textContent = p.store + (p.postedByName ? "　" + p.postedByName : "");
    var time = document.createElement("span");
    time.className = "post-time";
    time.textContent = formatBoardTime(p.postedAt);
    header.appendChild(store);
    header.appendChild(time);
    card.appendChild(header);

    if (p.image) {
      var img = document.createElement("img");
      img.src = p.image;
      img.style.cssText = "width:100%;border-radius:4px;margin:0 0 10px;display:block;";
      card.appendChild(img);
    }

    var body = document.createElement("p");
    body.className = "post-body";
    body.textContent = p.body;
    card.appendChild(body);

    var footer = document.createElement("div");
    footer.className = "post-footer";

    var names = readerNames(p.readBy);
    var namesEl = document.createElement("p");
    namesEl.className = "read-names";
    namesEl.style.display = "none";
    if (names.length) { namesEl.textContent = "既読：" + names.join("・"); }

    var badge = document.createElement("span");
    badge.className = "read-badge";
    badge.textContent = "既読 " + p.readBy.length + "/" + totalStaff;
    if (names.length) {
      badge.classList.add("read-badge-tappable");
      badge.onclick = function () {
        namesEl.style.display = (namesEl.style.display === "none") ? "block" : "none";
      };
    }

    footer.appendChild(badge);
    card.appendChild(footer);

    if (names.length) { card.appendChild(namesEl); }

    list.appendChild(card);
  });
}

async function refreshBoard() {
  await syncStaffRosterFromSupabase();
  totalStaff = getStaffRoster().length;
  onPostStoreChange();
  var result = await fetchBoardPosts();
  if (result === null) {
    document.getElementById("post-list").innerHTML = '<p class="page-note">Supabase未設定のため掲示板は表示できません</p>';
    document.getElementById("post-btn").disabled = true;
    return;
  }
  posts = result;
  render();
}

async function postNotice() {
  var store = document.getElementById("post-store").value;
  var name = document.getElementById("post-name").value;
  var body = document.getElementById("post-body").value.trim();
  var fileInput = document.getElementById("post-image");
  var file = fileInput.files && fileInput.files[0];
  if (!body) { return; }

  var btn = document.getElementById("post-btn");
  var postedBy = name ? findEmployeeId(name) : null;

  async function submit(imageData) {
    btn.disabled = true;
    btn.textContent = "投稿中...";
    var res = await postBoardMessage(store, body, imageData, postedBy);
    btn.disabled = false;
    btn.textContent = "この内容で投稿する";
    if (res.error) {
      showError("投稿に失敗しました。時間をおいて再度お試しください");
      return;
    }
    document.getElementById("post-body").value = "";
    fileInput.value = "";
    await refreshBoard();
  }

  if (file) {
    var reader = new FileReader();
    reader.onload = async function (e) {
      var resized = await resizeImageDataUrl(e.target.result, 1000, 0.75);
      submit(resized);
    };
    reader.readAsDataURL(file);
  } else {
    submit(null);
  }
}

refreshBoard();
</script>
</body>
</html>
