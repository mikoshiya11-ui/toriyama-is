<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在庫管理 | 鳥やま 社内システム</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
  <img src="../assets/logo.png" alt="鳥やま" class="logo" style="width:64px;margin-bottom:24px;">
  <h1 class="page-title">在庫管理</h1>
  <p class="page-note" id="scan-instruction" style="margin-bottom:16px;">棚のバーコードをスキャンしてください</p>

  <div class="step" style="width:288px;">
    <input class="field" id="scan-input" type="text" placeholder="バーコードをスキャン" autocomplete="off" autofocus>

    <div id="match-area" style="display:none;">
      <div class="card-result new" style="display:block;">
        <p class="card-result-name" id="match-name"></p>
        <p class="card-result-sub" id="match-sub"></p>
      </div>

      <input class="field zaiko-qty-input" id="qty-input" type="number" step="0.01" inputmode="decimal" placeholder="数量を入力してEnter">

      <button type="button" class="nav-btn" id="cancel-btn" onclick="cancelMatch()">キャンセル</button>
    </div>

    <p class="page-note" id="scan-error" style="color:#993556;display:none;margin-top:8px;"></p>

    <p class="page-note" style="margin:24px 0 8px;text-align:left;">直近の入力ログ</p>
    <div id="log-list"></div>
  </div>

  <a class="back" href="zaiko-list.html" style="margin-top:16px;">一覧で確認・手入力はこちら</a>
  <a class="back" href="staff.html">スタッフメニューへ戻る</a>
</div>

<script src="../zaiko-utils.js"></script>
<script>
var scanLogKey = "toriyama_zaiko_scan_log";
var matched = null; // { store, category, masterItem }

function getScanLog() {
  try { return JSON.parse(localStorage.getItem(scanLogKey) || "[]"); }
  catch (e) { return []; }
}

function pushScanLog(entry) {
  var log = getScanLog();
  log.push(entry);
  localStorage.setItem(scanLogKey, JSON.stringify(log));
  renderLog();
}

function timeNow() {
  var d = new Date();
  return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}

function renderLog() {
  var log = getScanLog();
  var el = document.getElementById("log-list");
  el.innerHTML = "";
  var recent = log.slice(-6).reverse();
  if (recent.length === 0) {
    el.innerHTML = '<p class="page-note">まだ入力がありません</p>';
    return;
  }
  recent.forEach(function (r) {
    var row = document.createElement("div");
    row.className = "log-row";
    row.innerHTML = "<span>" + r.name + "　数量" + r.qty + "</span><span>" + r.time + "</span>";
    el.appendChild(row);
  });
}

function focusScan() {
  var input = document.getElementById("scan-input");
  input.value = "";
  input.focus();
}

function showError(msg) {
  var el = document.getElementById("scan-error");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(function () { el.style.display = "none"; }, 2500);
}

function onScanCode(code) {
  document.getElementById("scan-error").style.display = "none";
  var result = findItemByCode(code);
  if (!result) {
    showError("品番が見つかりません：" + code);
    focusScan();
    return;
  }
  matched = result;
  var effective = getEffectiveItem(result.store, result.masterItem);

  document.getElementById("match-name").textContent = effective.name;
  document.getElementById("match-sub").textContent = result.store + "　現在の数量：" + formatQty(effective.qty) + "　（品番：" + result.masterItem.code + "）";
  document.getElementById("match-area").style.display = "block";
  document.getElementById("scan-instruction").textContent = "数量を入力してEnterで確定してください";

  var qtyInput = document.getElementById("qty-input");
  qtyInput.value = "";
  qtyInput.focus();
}

function cancelMatch() {
  matched = null;
  document.getElementById("match-area").style.display = "none";
  document.getElementById("scan-instruction").textContent = "棚のバーコードをスキャンしてください";
  focusScan();
}

function commitQty() {
  if (!matched) { return; }
  var qtyInput = document.getElementById("qty-input");
  var qty = parseFloat(qtyInput.value);
  if (isNaN(qty) || qty < 0) {
    showError("数量を正しく入力してください");
    qtyInput.focus();
    return;
  }

  setItemState(matched.store, matched.masterItem.name, { qty: qty });
  pushScanLog({ name: matched.masterItem.name, store: matched.store, qty: formatQty(qty), time: timeNow() });

  matched = null;
  document.getElementById("match-area").style.display = "none";
  document.getElementById("scan-instruction").textContent = "棚のバーコードをスキャンしてください";
  focusScan();
}

document.getElementById("scan-input").addEventListener("keydown", function (e) {
  if (e.key !== "Enter") { return; }
  e.preventDefault();
  var code = this.value.trim();
  if (!code) { return; }
  onScanCode(code);
});

document.getElementById("qty-input").addEventListener("keydown", function (e) {
  if (e.key !== "Enter") { return; }
  e.preventDefault();
  commitQty();
});

renderLog();
focusScan();
</script>
</body>
</html>
